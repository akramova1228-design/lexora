erican and Asian countries.","a":"operates"},{"t":"gap","q":"It first ___ out of a small garage in Washington state.","a":"operated"},{"t":"gap","q":"In 2011 a ___ computer followed, the Amazon Fire.","a":"tablet"},{"t":"gap","q":"Economic experts say that Amazon is turning Internet business into a ___.","a":"monopoly"}]},{"id":"a12","day":12,"title":"Swiss Banks","text":"Switzerland is not only well-known for chocolate and its watch-making industry. It is also famous for its unique banking and financial system. Banks play an important role in Switzerland’s economy. Swiss banks have been considered to be the most secretive in the world for many centuries. About a third of all money held outside a person’s home country - hundreds of billions of dollars - is deposited in Swiss banks.\n\nBanking in Switzerland goes back to the 18th century. In the past, not only rich people but also authoritarian regimes and dictators have secured their money in Swiss banks. Foreigners who live in unstable and troubled areas also tend to keep money in secure Swiss banks instead of their own. During World War II German Nazis deposited much of the country’s wealth, especially money and gold taken away from Jews , in Switzerland.\n\nSwitzerland has two large banks - UBS and Credit Suisse. Private banking also has a century-long tradition in the alpine country. Currently, about 130000 people work in the banking sector. Major banks have overseas branches that employ thousands.\n\nSwitzerland’s popularity as a safe bank haven has many reasons. For one, the country has a very stable and prosperous economy, and one of the highest per capita incomes in the world. It has been neutral for many centuries, especially during the two world wars. In addition, the Swiss franc is one of the most stable currencies in the world.\n\nSwiss banks have to follow very strict privacy rules. In 1934, a law was passed that forbade Swiss banks to reveal the name of account holders. Banks protect the privacy of their clients in a way no other country in the world does. If a Swiss banker reveals anything about a person’s bank account without permission he commits a criminal act. Such regulations have made Switzerland a popular destination for foreigners who do not want to pay taxes in their own country.\n\nLately, however, the Swiss government has been under constant pressure by other countries to change their bank laws, making it possible to reveal the names of possible drug dealers or international criminals. EU officials claim that more and more citizens are moving their money to Switzerland to escape taxation in their home country. Income that is not reported to the government is often deposited in Swiss banks.\n\nIn the past decade Swiss bank officials have been working together with international financial experts to combat money laundering. Under new laws they must report any financial transactions that look suspicious.","targets":[["account holder","person who has money in a bank"],["act","action"],["alpine","in the Alps"],["authoritarian regime","government that is very strict to its people and does not allow them basic rights or freedom"],["branch","part of a company that does work in another country"],["combat","fight"],["commit","do something wrong or illegal"],["considered to be","people think that …"],["currency","the money a country uses"],["currently","at the moment"],["deposit","put, place, leave"],["destination","target"],["economy","the system by which a country’s money and goods are produced and used"],["employ","give work to"],["escape","get away from"],["especially","above all"],["forbid – forbade","not allow"],["foreigner","person who lives in another country"],["haven","place where you can put something in order to protect it from danger"],["in addition","also"],["Jew","someone, whose religion is Judaism"],["law","rules that a country passes"],["major","very important"],["money laundering","when money that is received illegally is put into businesses and banks in other countries , so that it is difficult for people to find out where it came from"],["neutral","not taking part in wars or helping other countries"],["official","person in a high position in the government or other organisations"],["overseas","countries across the ocean"],["per capita income","the money every Swiss person earns in a year"],["permission","being allowed to do something"],["popularity","something that makes a place very attractive"],["privacy","about private things"],["prosperous","wealthy, booming"],["regulations","rules"],["reveal","make known"],["secretive","private, guarded, well-defended"],["secure","to make something safe"],["suspicious","something that might be against the law"],["transaction","when money is transferred from one account to another"],["troubled","with many problems"],["unique","only one of its kind; very special"],["unstable","areas where the political situation can change very often"]],"qs":[{"t":"tf","q":"“neutral” means: not taking part in wars or helping other countries","a":true},{"t":"tf","q":"“permission” means: person who lives in another country","a":false},{"t":"tf","q":"“suspicious” means: something that might be against the law","a":true},{"t":"tf","q":"“official” means: the money a country uses","a":false},{"t":"tf","q":"“troubled” means: with many problems","a":true},{"t":"mcq","q":"Which word means: “give work to”?","o":["employ","deposit","currency"],"a":0},{"t":"mcq","q":"Which word means: “person who lives in another country”?","o":["haven","foreigner","neutral"],"a":1},{"t":"mcq","q":"Which word means: “very important”?","o":["major","unique","currency"],"a":0},{"t":"mcq","q":"Which word means: “the money a country uses”?","o":["overseas","deposit","currency"],"a":2},{"t":"mcq","q":"Which word means: “the system by which a country’s money and goods are produced and used”?","o":["economy","troubled","haven"],"a":0},{"t":"gap","q":"It is also famous for its ___ banking and financial system.","a":"unique"},{"t":"gap","q":"Banks play an important role in Switzerland’s ___.","a":"economy"},{"t":"gap","q":"About a third of all money held outside a person’s home country - hundreds of billions of dollars - is ___ in Swiss banks.","a":"deposited"},{"t":"gap","q":"Private banking also has a century-long tradition in the ___ country.","a":"alpine"},{"t":"gap","q":"___, about 130000 people work in the banking sector.","a":"currently"}]},{"id":"a13","day":13,"title":"OPEC: The World’s Oil Cartel","text":"OPEC is the Organization of Petroleum Exporting Countries. It was founded in Bagdad in 1960 and has currently 11 members. OPEC’s aim is to regulate the amount of oil that member nations produce and to keep prices at a steady rate. The countries get together twice a year and agree on how much oil each country is allowed to produce. OPEC’s headquarters are in Vienna, the capital of Austria.\n\nBefore OPEC was created, there were large oil companies that controlled the world’s oil production. They wanted to sell as much oil as possible and did not let governments influence their decisions. Oil-rich countries, especially in the Middle East, wanted more control over the oil that they produce. As a result, Iran, Iraq, Saudi Arabia, Kuwait and Venezuela founded OPEC. In the following years Qatar, Indonesia, Libya, Algeria, Nigeria, Ecuador, Angola and the United Arab Emirates also become members.\n\nIn the 1960s, OPEC did not have much power. This changed in 1973 when the third Arab- Israeli war started. The United States and a few European countries supported Israel. As a form of punishment, OPEC nations, influenced by the Arab countries, stopped selling oil to the West. Within the next six years oil prices rose to ten times the price of the early 1970s. OPEC countries became rich with so-called petrodollars; the West sank into deep recession because they needed OPEC’s oil.\n\nIn the aftermath of the energy crisis of the 1970s, western countries started looking for alternative forms of energy in order to become more independent from OPEC and the oil-producing nations. In 1986, oil prices dropped to the lowest rate in history. Oil- producing nations lost much of their income. In the 80s and 90s OPEC’s power diminished, often because of conflicts and internal arguments and because member states could not agree on production quotas. Some OPEC countries did not keep agreements and produced more oil, thus lowering prices.\n\nAfter 2000, oil prices began to rise again and reached an all-time high in 2007.\n\nThe financial crisis of 2007 and 2008 hit world economy hard and oil prices fell once again. Since the Arab Spring of 2011, prices have gone up and down several times.\n\nToday OPEC still controls about 60% of the world’s oil reserves and produces 40% of the world’s oil. Saudi Arabia is the most powerful member of the group, because it has the largest reserves. Even though there have been quarrels in the cartel in the last 5 decades it remains a powerful organization.","targets":[["aftermath","what comes after a special event"],["agree on","decide, come to a decision"],["agreement","promise, deal"],["aim","goal; what somebody wants to do"],["all-time high","the highest price in history"],["alternative","other, new"],["amount","how much of a product"],["argument","quarrel, fight"],["as a result","that is why"],["capital","most important city of a country; in which the government is"],["cartel","countries that agree to sell something at the same price"],["currently","right now, at the moment"],["decision","deciding something"],["diminish","become less, weaker"],["drop","go down"],["economy","the system by which a country’s money and goods are produced and used"],["especially","above all"],["even though","while"],["found-founded","start, create something new"],["government","people who rule a country"],["headquarters","the main building of an organization"],["income","the money you get for selling products"],["independent","free"],["influence","power, control"],["internal","between member countries"],["petrodollars","money that you get by selling oil"],["petroleum","oil"],["production quota","official limit on how much a country can produce"],["punishment","penalty; to make someone suffer because they have done something wrong"],["quarrel","argument, fight"],["rate","price"],["recession","difficult time in business, when there is less production and people do not earn enough money and buy things"],["regulate","control"],["remain","stay"],["reserves","the oil that probably is in the ground and can be produced in the future"],["rise – rose- risen","go up"],["several","a few"],["steady rate","stable price"],["support","help; assist"],["thus","therefore"],["twice","two times"]],"qs":[{"t":"tf","q":"“support” means: help; assist","a":true},{"t":"tf","q":"“capital” means: other, new","a":false},{"t":"tf","q":"“currently” means: right now, at the moment","a":true},{"t":"tf","q":"“quarrel” means: goal; what somebody wants to do","a":false},{"t":"tf","q":"“decision” means: deciding something","a":true},{"t":"mcq","q":"Which word means: “between member countries”?","o":["internal","aim","argument"],"a":0},{"t":"mcq","q":"Which word means: “other, new”?","o":["petrodollars","alternative","quarrel"],"a":1},{"t":"mcq","q":"Which word means: “quarrel, fight”?","o":["argument","decision","support"],"a":0},{"t":"mcq","q":"Which word means: “goal; what somebody wants to do”?","o":["aim","amount","quarrel"],"a":0},{"t":"mcq","q":"Which word means: “the money you get for selling products”?","o":["income","agreement","diminish"],"a":0},{"t":"gap","q":"OPEC is the Organization of ___ Exporting Countries.","a":"petroleum"},{"t":"gap","q":"The United States and a few European countries ___ Israel.","a":"supported"},{"t":"gap","q":"In 1986, oil prices dropped to the lowest ___ in history.","a":"rate"},{"t":"gap","q":"The financial crisis of 2007 and 2008 hit world ___ hard and oil prices fell once again.","a":"economy"},{"t":"gap","q":"Today OPEC still controls about 60% of the world’s oil ___ and produces 40% of the world’s oil.","a":"reserves"}]},{"id":"a14","day":14,"title":"Banks and Banking","text":"A bank is a company that works with the money that the people give it. If you give your money to a bank, it not only protects it but pays you interest so that it can work with the money. This is one of the reasons why people save their money in a bank. Money may also be safer there than at home.\n\nBanks also lend money to other businesses and customers. They collect extra money called banking fees with which they pay interest to savers as well as salaries for their workers. Banks make a profit because they collect more interest than they pay to savers.\n\nWithout banks the world’s economy would not be able to grow. Investors would not find the money they need for new projects. Industries could not buy new machines and modern technology.\n\nWhat kind of services do banks offer?\n\nBanks provide their customers with a number of services. With a checking account you can pay your bills. A check is a slip of paper that tells the bank how much money it should withdraw from your account and pay to someone else. Today, more and more people use the internet, also a banking service, to pay their bills. Banks also give their customers plastic cards with which they can get money from their account everywhere and whenever they want. They can also use them to pay without cash at shops, gas stations and other stores. Checking accounts are a comfortable way for customers to handle their money.\n\nFor people who want to save money banks offer savings accounts. Usually, banks pay more interest for savings accounts than they do for checking accounts. They hope that the customers will leave their money in the bank for a long time, which is why the bank can work with this money and offer it as loans. Banks, however, cannot give all of their money as loans. In most countries the government limits the amount of money that banks can use as loans. They must always keep back a certain percentage in the form of cash.\n\nPeople who need money for certain things like buying a house or a car need a lot of money quickly. The money they borrow from a bank is called a loan. In most cases they do not pay back all of the money at once but a small part of it, with interest, every month. If someone cannot pay back a loan the bank usually can take away valuable objects like cars or houses. Modern banks offer their customers many other services as well. They tell them how they can make money with investments in stocks and bonds. Credit cards are given to customers as a cash-free way of buying things. Almost all banks have automatic teller machines (ATM) at which customers receive money from their account. Telephone banking is an easy way to pay your bills by calling a special telephone number and typing in a certain sequence of digits. Some banks even deal with insurance.\n\nTypes of banks Commercial banks are the most important banks. They offer many services, different forms of accounts and also loans. While, at first, commercial banks only offered its services to businesses and companies, they are for everyone today.\n\nInvestment banks do not take or keep the money of individuals. They help organizations and large companies raise money on the international financial markets.\n\nCentral banks manage the banking system in a country. The Federal Reserve in the United States and Bank of England are two prominent banks that take over these tasks. The European Central Bank is responsible for the circulation of money in the Euro zone. Online banks can often give their customers more interest because they do not have the expenses that physical banks do. They can be accessed over the internet and are becoming more and more popular.\n\nSavings and loans are banks that specialize in financing houses. Although interest rates are higher such banks offer up to 30-year mortgages. Customers pay back their loan through a monthly payment that they can afford.\n\nDevelopment banks are financial organizations that help Third World Countries. They not only provide money for nations in Africa, Asia and South America, but also send aid workers and offer technical help.\n\nInternational banking The world’s largest banks are located in Europe, the United States and Japan. In most cases they operate in many countries of the world. Because banking is a global industry that does not stop at a country’s borders there must be worldwide agreements.\n\nInternational standards that banks must obey are written down in the Basel accords. History of banking Banking has a long tradition. In Mesopotamia bankers kept gold and silver for people and lent it to others. Ancient Rome and Greece had similar banking systems to the ones we have today.\n\nDuring the Middle Ages Italy was the centre of European banking. Jewish traders emerged as the first bankers and became very successful businessmen. Florence and Venice became known as two cities in which many people earned their money through banking. The Medici family dominated Florence for over two centuries and set up Europe’s largest bank in the 15 th century.\n\nThe first world wide banking crisis emerged during the Great Depression in 1929.\n\nMany citizens lost their jobs and their savings as banks crashed. In 1933 American president Franklin D. Roosevelt signed a bill in which the government guaranteed the savings of depositors if a bank went bankrupt.\n\nIn 2008 a banking crisis hit America and spread throughout the world. Banks gave homeowners mortgages without checking their financial backgrounds. House prices began to drop and banks lost a lot of money. Governments in many countries had to give them money and prevent them from becoming bankrupt.","targets":[["access","the right to use something"],["accords","set of agreements or rules"],["account","the place where your money is kept"],["afford","to have enough money for something"],["agreement","written promise made by two or more people, companies or countries"],["aid","help"],["amount","sum"],["automatic teller machine","a machine outside a bank that you use to get money from your account"],["bankrupt","to go out of business"],["bill","a written piece of paper that shows how much you must pay for something"],["bill","a written suggestion for a new law"],["bond","a document that shows a company or the government will pay back money that it has borrowed from you"],["border","official line that separates two countries"],["business","company"],["cash","banknotes"],["cash-free","without money"],["certain","special"],["circulation","movement, flow"],["citizen","a person who lives in a country and has rights there"],["comfortable","handy, practical"],["crash","if you do not have enough money to pay what you owe someone"],["credit card","a small plastic card that lets you buy things and pay for them later"],["customer","a person who buys things"],["deal with","work with, offer"],["depositor","someone who puts money in a bank"],["digit","number"],["dominate","to be number one"],["economy","a system of buying and selling goods in a country"],["emerge","come up"],["expense","the amount of money that you spend on something"],["fee","charge, amount of money"],["global","worldwide"],["Great Depression","economic problems after the Wall Street crash of 1929; many banks and businesses went out of business and millions of people all over the world lost their jobs"],["guarantee","promise"],["handle","deal with"],["however","but"],["individual","single person"],["insurance","the money you pay regularly to a company; it pays for a damage if something bad happens or if you become ill"],["interest","the extra money that you must pay back when you borrow money"],["interest rate","the percentage amount that banks give to savers when they leave their money there or charge customers when they borrow money"],["investor","a person who gives money to a company or a business and wants to make a profit"],["Jewish","someone whose religion is Judaism"],["limit","to stop something from becoming higher or bigger"],["loan","the amount of money that you borrow from a bank"],["located","situated, to be found"],["mortgage","agreement between a customer and a bank in which it lends you money to buy a house; you have to pay back the money with interest over a longer period of time"],["obey","follow"],["payment","monthly sum"],["percentage","part of a whole"],["physical","bank in a building that you can go to"],["profit","income, extra money"],["prominent","famous"],["protect","look after, care for"],["provide","give, offer"],["raise","collect, gather"],["responsible","in charge of"],["salary","the money you get every month for doing your job"],["sequence","series"],["service","help or other types of work that you offer a customer"],["sign","to put your name on a document"],["similar","almost the same"],["spread","to move from one place to another"],["standard","guideline, rule"],["stock","a share of a company"],["task","job"],["technology","machines, know-how"],["throughout","all over"],["trader","a person who buys and sells something"],["valuable","very expensive, costly"],["withdraw","take out"]],"qs":[{"t":"tf","q":"“stock” means: a share of a company","a":true},{"t":"tf","q":"“investor” means: a written piece of paper that shows how much you must pay for something","a":false},{"t":"tf","q":"“limit” means: to stop something from becoming higher or bigger","a":true},{"t":"tf","q":"“payment” means: the amount of money that you borrow from a bank","a":false},{"t":"tf","q":"“account” means: the place where your money is kept","a":true},{"t":"mcq","q":"Which word means: “almost the same”?","o":["comfortable","physical","similar"],"a":2},{"t":"mcq","q":"Which word means: “a written piece of paper that shows how much you must pay for something”?","o":["dominate","bill","raise"],"a":1},{"t":"mcq","q":"Which word means: “the amount of money that you spend on something”?","o":["expense","circulation","customer"],"a":0},{"t":"mcq","q":"Which word means: “the amount of money that you borrow from a bank”?","o":["loan","access","expense"],"a":0},{"t":"mcq","q":"Which word means: “if you do not have enough money to pay what you owe someone”?","o":["accords","crash","protect"],"a":1},{"t":"gap","q":"Without banks the world’s ___ would not be able to grow.","a":"economy"},{"t":"gap","q":"They can also use them to pay without ___ at shops, gas stations and other stores.","a":"cash"},{"t":"gap","q":"The money they borrow from a bank is called a ___.","a":"loan"},{"t":"gap","q":"They help organizations and large companies ___ money on the international financial markets.","a":"raise"},{"t":"gap","q":"International banking The world’s largest banks are ___ in Europe, the United States and Japan.","a":"located"}]},{"id":"a15","day":15,"title":"Credit Rating Agencies","text":"A credit rating agency is a powerful company that rates how good you are in paying back your debts. It rates businesses, private individuals and even whole countries. The credit rating company gives a score on how able you are to pay back a debt or a loan.\n\nBanks take risks when they lend person money. If they don’t know anything about the person or company they lend money which they may not see ever again. The same applies to a whole country. If a country is in money troubles and it goes to banks to seek loans the banks must be sure that they can pay them back.\n\nIn the last few months and years problems on the European financial market have arisen because credit rating agencies have downgraded countries like Greece, Portugal or Ireland, making it more difficult for them to borrow money.\n\nThe rating of a credit rating agency has an influence on how much interest you must pay for a loan. Individuals, companies or countries with very good ratings usually get money at lower interest rates, whereas having a bad rating means that giving you money is a risky business so you have to pay more interest.\n\nAlthough there are many credit rating agencies all over the world, three big ones that have the most power and influence: Standard & Poor’s and Moody’s, two American- based agencies control about 40 % of the market each. The third agency, Fitch ratings, controls about 14% and operates from New York and London.\n\nCredit rating agencies collect all kinds of information on firms, companies and countries. The agencies get paid by the companies or businesses that want their bonds or shares rated.\n\nAgencies have different methods of rating. The best possible rating is AAA, or triple A. This means that you can borrow money cheaply. Ratings can go all the way down to C or D, meaning that companies or businesses are not able to play back money and are basically bankrupt.\n\nIn most cases credit rating firms also assess how businesses, regions and countries will develop economically in the future. For example, The United State's rating was downgraded by Standard and Poor’s a short time ago to AA+ , because the agency thought there was a slight risk of borrowing money from the American government. Such a downgrading can cause the loss of a good reputation of a country or business.\n\nCriticism of these credit rating agencies has come up in the past months and years. During the global financial crisis of 2008, the agencies admitted that they did make mistakes in their ratings, which led partly to the crisis. The rating agencies gave best ratings to borrowers during the housing crisis in America. It turned out that many were not able to pay their debts back.\n\nDiscussion has been going on about the importance of rating agencies. Some financial experts doubt that they are needed at all. European politicians criticize the fact that they    36 are dependent on American rating agencies.","targets":[["able","to be in a situation where you can do something"],["admit","to say that something is true, even if you don’t want it to be"],["American-based","they have their command centre in America"],["apply","work for"],["assess","measure, find out"],["bankrupt","without enough money to pay back"],["bond","an official document that promises that a government or company will pay back money that it has borrowed from you"],["borrow","to get something and give it back after a certain time"],["business","task, job"],["criticism","to say what you think is bad about something"],["debt","the money that you have borrowed from someone and must give back"],["dependent on","need"],["doubt","to think that something may not be true or if you do not trust something"],["downgrade","to give a lower rating"],["economically","about the economy"],["financial","money"],["global financial crisis","between 2007 and 2009 in which many banks around the world collapsed and had to be helped by governments"],["importance","meaning, power"],["influence","power, control"],["interest rate","the extra money that you must pay to a bank when you borrow money from them; in percent"],["lend","to let someone borrow money form you for a short time"],["loan","the money that you have borrowed from a bank"],["loss","to no longer have something"],["operate","work"],["politician","person who is in politics or works for the government"],["rate","to give a number or a score, based on the quality of something"],["reputation","name, status"],["score","number, rating"],["seek","want to have"],["share","the part of a company"],["slight","small"]],"qs":[{"t":"tf","q":"“importance” means: meaning, power","a":true},{"t":"tf","q":"“score” means: to think that something may not be true or if you do not trust something","a":false},{"t":"tf","q":"“downgrade” means: to give a lower rating","a":true},{"t":"tf","q":"“lend” means: to no longer have something","a":false},{"t":"tf","q":"“rate” means: to give a number or a score, based on the quality of something","a":true},{"t":"mcq","q":"Which word means: “the money that you have borrowed from a bank”?","o":["loan","borrow","debt"],"a":0},{"t":"mcq","q":"Which word means: “to think that something may not be true or if you do not trust something”?","o":["doubt","debt","downgrade"],"a":0},{"t":"mcq","q":"Which word means: “to be in a situation where you can do something”?","o":["able","debt","influence"],"a":0},{"t":"mcq","q":"Which word means: “to no longer have something”?","o":["importance","loss","rate"],"a":1},{"t":"mcq","q":"Which word means: “name, status”?","o":["rate","reputation","importance"],"a":1},{"t":"gap","q":"Banks take risks when they ___ person money.","a":"lend"},{"t":"gap","q":"If they don’t know anything about the person or company they ___ money which they may not see ever again.","a":"lend"},{"t":"gap","q":"The third agency, Fitch ratings, controls about 14% and ___ from New York and London.","a":"operates"},{"t":"gap","q":"Credit ___ agencies collect all kinds of information on firms, companies and countries.","a":"rating"},{"t":"gap","q":"The best possible ___ is AAA, or triple A.","a":"rating"}]},{"id":"a16","day":16,"title":"Stocks and the Stock Market","text":"The stock exchange is a marketplace where brokers buy and sell stocks and bonds for other people. Many countries have one or more stock exchanges. Smaller stock exchanges often handle only national stock, whereas the big stock exchanges handle the stock of big international corporations.\n\nCorporation A corporation is a company that has the right to issue stocks. They are registered with the government and have laws that protect them and their shareholders.\n\nEvery corporation has a board of directors who make decisions for the company.\n\nPeople who invest in a corporation usually have limited liability. If a corporation goes bankrupt investors only lose the money that they have invested. Stocks and Bonds A person who buys stock becomes one of the company’s owners. They buy a share of a company. A bond is an agreement to lend money to a company for a certain period of time. Companies sell stocks and bonds to people because they need money and want to expand. Sometimes they want to build more factories or develop more products.\n\nIf a company makes profits it can use the earned money in a few ways. It may decide to invest more into the company and expand. Most of the time the shareholders of the company get a dividend, which is a part of the yearly profit. This dividend is not always the same and can change from year to year.\n\nMost corporations offer two kinds of stock. Owners of common stock can go to the annual meetings of stockholders, present their own ideas there, ask questions about the company and have a right to vote for the board of directors.\n\nOwners of preferred stock usually do not have voting rights or the right to attend stockholders’ meetings. However, they get dividends.\n\nA person who buys a bond is not buying ownership in a company but lending the company money. It promises to give back the money to the bondholder after a certain time, such as ten or twenty years. In return for the money, the companies pay interest. Not only companies but also governments can issue bonds if they need money.\n\nPeople buy stocks and bonds because they hope that a corporation will earn money as it grows. As time goes on shareholders usually earn more money by owning stock than by saving their money in a bank or investing in other things.\n\nBuying stock is also a risky business. If you buy a share of a certain company and it does well over the years the value of your shares will go up. You could sell them at a much higher price than when you bought them. Sometimes, however, things happen that make the value of certain stocks go down. If a company does badly or goes bankrupt the value of your shares goes down too and you actually lose money.\n\nThere are many reasons why the price of a company’s stock rise or fall. For example if people are afraid that prices will go down, they may start selling their shares. If many people sell a large number of stocks, they can actually make prices go down. If this continues for a longer time it may lead to a crash. Prices of stocks fall so low that people don’t want to buy them any more because they are afraid they won’t get their money back.\n\nStock exchange To buy stock most people go to a broker, a person who is member of a company that is allowed to buy and trade bonds and stock.\n\nLet’s say someone in California wants to buy 2000 shares of a company. He doesn’t have to travel to the New York Stock Exchange. He calls a stockbroker, usually a member of a brokerage house, who gives him information on the company and tells him the price of the stock. When the investor tells him to buy, the broker sends the order to his firm’s trading desk at the stock exchange which then places the order. The order is sent to stock tickers throughout the country that constantly display the value of stocks. Because buying and selling stocks is concentrated in one place you know the price of each stock at once.\n\nStocks are often traded under a contract called an option. It allows a person to buy or sell stock at a certain price within a certain time. If the value rises within that time and within the price set the stock is quickly sold again. The prices change throughout the day depending on how good or bad trading is. Small orders are usually executed automatically by computers. Large orders however are traded directly at the stock exchange.\n\nEach year investors trade billions of shares worth hundreds of billions of dollars. But not all companies are listed on the stock market. You must be pretty big and have a lot of power. You must also show the stock exchange that you are in a good financial position and that you company is doing well. The world’s biggest stock exchange in New York has about 3oooo companies listed.\n\nTo see how well or badly stocks are doing most stock exchanges have an index. This is a number that shows the average share prices of the major companies. The most important indices are the Dow Jones (New York), FTSE (London), DAX (Frankfurt), Nikkei (Tokyo), Hang Seng (Hongkong) Bulls and Bears Bears are cautious animals that don’t like to move fast. Bulls are animals that like to charge ahead. At the stock exchange bears are investors who believe that the price of stock will go down. A bull believes that the prices will go up. Likewise, a bear market is a period in which stocks usually fall in value, a bull market a time when they rise. History of the stock exchange The first European stock exchange was founded in Antwerp, Belgium in 1531. The first stock exchange in England was formed by a group of brokers in London in 1773. Until that time people usually went to coffee houses to buy and sell stocks because they found the brokers there.\n\nIn New York City brokers met under an old tree on Wall Street. They organized the New York stock exchange in 1792.\n\nFor many years only rich people bought and sold stock. It was not until World War I that more and more private investors started investing their money in stocks. There was a huge rise in value and investors made a lot of money Stock market crash of 1929 The worst crash happened in the United States in October 1929. Over many days investors sold so many stocks that the whole market collapsed. This affected the economy not only in America but in Europe as well. Farmers could not sell their crops, factories couldn’t sell their products, banks had to close and workers earned very little money. This lasted for almost ten years and became later known as the Great Depression.\n\nWorld’s biggest stock markets","targets":[["actually","really"],["affect","influence"],["agreement","if two people, companies or countries promise to do something"],["annual","yearly"],["attend","go to"],["average","usual, normal"],["bankrupt","if you don’t have enough money to pay back banks and the money you have borrowed from other people"],["billion","one thousand million"],["board of directors","group of people in accompany who make the important decisions"],["bond","a document that promises that a company or the government will pay back money to you"],["bondholder","a person who owns bonds"],["broker","someone who buys and sells things like shares of a company to other people"],["brokerage house","a company of brokers"],["business","company"],["cautious","careful"],["certain","special"],["charge","attack; move forward very quickly"],["collapse","break down"],["concentrated","happens"],["constantly","the whole time"],["continue","to go on"],["contract","a written paper between two people or companies"],["corporation","a very big company"],["crash","the collapse of the whole system"],["crop","a plant like wheat or corn that farmers grow for food"],["decision","a choice you make after you discuss something"],["depend","something is affected by something else"],["develop","grow"],["dividend","part of a company’s yearly profit that is divided up among shareholders"],["economy","the system of buying and selling of goods in a country"],["execute","to do, carry out"],["expand","grow"],["government","people who rule a country"],["Great Depression","the time after the stock market crash; the 1930s in which people lost jobs in the US and in most European countries"],["handle","deal with"],["huge","very big"],["index, indices","list of prices at the stock exchange"],["interest","the extra money that you must pay back when you borrow something"],["issue","the right to produce shares"],["lay","system of rules that a country has"],["lend","to give for a short time"],["limited liability","you only pay a certain amount if something happens to you or your company – you don’t have to pay all of it"],["list","to be in a directory"],["little","not very much"],["major","important"],["national stock","shares of a company that is in your own country"],["option","the right to buy shares at a special price with in a certain time"],["order","if someone asks you to buy or sell something"],["own","have, possess"],["owner","a person who something belongs to"],["ownership","if you have or possess something"],["present","show"],["profit","the money you get when you sell things, after you have paid for your costs"],["promise","to say that you will do something"],["protect","defend, guard"],["right","something that you are officially allowed to have or do"],["rise","to go up"],["share","a part of the ownership of a company"],["shareholder","a person who owns shares of a company"],["stock","a share or part of a company"],["stock exchange","place where you trade stocks and bonds"],["stock ticker","a special machine that prints the price of company stocks"],["stockbroker","a person who buys and trades stock and bonds for other people"],["throughout","in all of"],["trade","to buy and sell goods"],["trading desk","the place at the stock exchange where the trading takes place"],["value","what something is worth"],["voting right","the right to vote"],["whereas","while, but"]],"qs":[{"t":"tf","q":"“list” means: to be in a directory","a":true},{"t":"tf","q":"“protect” means: a document that promises that a company or the government will pay back money to you","a":false},{"t":"tf","q":"“ownership” means: if you have or possess something","a":true},{"t":"tf","q":"“stock” means: a part of the ownership of a company","a":false},{"t":"tf","q":"“promise” means: to say that you will do something","a":true},{"t":"mcq","q":"Which word means: “a person who something belongs to”?","o":["agreement","owner","right"],"a":1},{"t":"mcq","q":"Which word means: “a document that promises that a company or the government will pay back money to you”?","o":["execute","broker","bond"],"a":2},{"t":"mcq","q":"Which word means: “while, but”?","o":["whereas","order","promise"],"a":0},{"t":"mcq","q":"Which word means: “a part of the ownership of a company”?","o":["little","share","protect"],"a":1},{"t":"mcq","q":"Which word means: “system of rules that a country has”?","o":["contract","collapse","lay"],"a":2},{"t":"gap","q":"Sometimes they want to build more factories or ___ more products.","a":"develop"},{"t":"gap","q":"It may decide to invest more into the company and ___.","a":"expand"},{"t":"gap","q":"In return for the money, the companies pay ___.","a":"interest"},{"t":"gap","q":"Prices of ___ fall so low that people don’t want to buy them any more because they are afraid they won’t get their money back.","a":"stocks"},{"t":"gap","q":"Bulls are animals that like to ___ ahead.","a":"charge"}]},{"id":"a17","day":17,"title":"Globalization","text":"Your shirt was made in Mexico and your shoes in China. Your CD player comes from Japan. You can travel to Moscow and eat a Big Mac there and you can watch an American film in Rome. Today goods are made and sold all over the world, thanks to globalization.\n\nGlobalization lets countries move closer to each other. People, companies and organizations in different countries can live and work together. We can exchange goods, money and ideas faster and cheaper than ever before. Modern communication and technology, like the Internet, cell phones or satellite TV help us in our daily lives. Globalization is growing quickly. A German company can produce cars in Argentina and then sell them in the United States. A businessman in Great Britain can buy a part of a company in Indonesia on one day and sell parts of another business in China the next, thanks to globalization. Fast food companies open shops around the world almost every day.\n\nHistory of Globalization Globalization is not new. For thousands of years people have been trading goods and travelling across great distances. During the Middle Ages, merchants travelled along the Silk Road, which connected Europe and China.\n\nThe modern age of globalization started with the Industrial Revolution at the end of the 18th century. New machines were able to produce cheaper goods. Trains and steam- powered boats transported products farther and faster.\n\nSince 1980, globalization has been moving at a faster pace. Today it is easier for companies to work in other countries. The Internet gives them the chance of reaching more customers around the world. Teleworkers work for firms that may be far away.\n\nHowever , there is a growing debate over globalization. Governments are in favour of globalization because the economy can grow. Other people are not so sure that there are only advantages. Here are some arguments from both sides: Good sides •   Globalization lets countries do what they can do best. If, for example, you buy cheap steel from another country you don’t have to make your own steel. You can focus on computers or other things. •   Globalization gives you a larger market. You can sell more goods and make more money. You can create more jobs. •   Consumers also profit from globalization. Products become cheaper and you can get new goods more quickly.\n\nBad sides •   Globalization causes unemployment in industrialized countries because firms move their factories to places where they can get cheaper workers. •   Globalization may lead to more environmental problems. A company may want to build factories in other countries because environmental laws are not as strict as they are at home. Poor countries in the Third World may have to cut down more trees so that they can sell wood to richer countries. •   Globalization can lead to financial problems . In the 1970s and 80s countries like Mexico, Thailand, Indonesia or Brazil got a lot of money from investors who hoped they could build up new businesses there. These new companies often didn’t work, so they had to close down and investors pulled out their money. •   Some of the poorest countries in the world, especially in Africa, may get even poorer. Their population is not as educated as in developed countries and they don’t have the new technology that we do. •  Human, animal and plant diseases can spread more quickly through globalization. Many experts say that we need a different kind of globalization in our world today. There must be ways to make sure that all countries profit from the good sides of globalization. We should help poorer countries by giving them better education and showing them how new technology works.\n\nEvery year, leaders of the world’s biggest industrial countries get together to discuss economic problems. This meeting is called the G8 summit. In the last few years groups against globalization have organized protest marches and demonstrations to point out that not everyone is happy with how the world’s economy is developing.","targets":[["advantage","the good side of something"],["age","period of history"],["argument","reasons"],["business","company"],["cause","lead to"],["cell phone","a mobile telephone"],["close down","to stop producing goods"],["connect","to link together"],["create","make"],["customer","a person who buys something"],["debate","discussion"],["develop","grow"],["developed countries","rich , industrialized countries"],["disease","illness"],["distance","space"],["economic","about the economy"],["economy","the system of producing goods and products in a country and selling them"],["educated","if you have gone to school and learned a lot"],["environmental","everything that is about the air, water or land around us"],["especially","above all, more than others"],["exchange","to give someone something and get something else in return"],["factory","building in which you produce goods"],["farther","over greater distances"],["firm","company"],["focus on","concentrate on"],["G8","Group of 8 = the most important industrialized countries in the world"],["goods","things that you produce and sell"],["government","the people who rule a country"],["however","but"],["in favour of","for something"],["investor","a person who gives money to a company and expects to get more money in return"],["law","rules that a country has"],["lead to","cause"],["leader","the most powerful person of a country"],["make sure","to check that something has been done"],["merchant","someone who buys and sells goods"],["pace","speed"],["point out","to show"],["produce","make"],["pull out","take out"],["reach","get to"],["Silk Road","an old route on which silk was carried from Europe to Central Asia"],["spread","to move from one place to another"],["steam—powered","run by a steam engine ; power is produced by making water hot so that it turns into a gas"],["steel","a strong metal that you can form"],["strict","exact"],["summit","meeting for powerful leaders of a country"],["teleworker","someone who works from home and uses a computer, telephone etc.."],["trade","to buy and sell goods"],["unemployment","if you don’t have a job"]],"qs":[{"t":"tf","q":"“unemployment” means: if you don’t have a job","a":true},{"t":"tf","q":"“debate” means: above all, more than others","a":false},{"t":"tf","q":"“steel” means: a strong metal that you can form","a":true},{"t":"tf","q":"“customer” means: everything that is about the air, water or land around us","a":false},{"t":"tf","q":"“trade” means: to buy and sell goods","a":true},{"t":"mcq","q":"Which word means: “someone who works from home and uses a computer, telephone etc..”?","o":["unemployment","farther","teleworker"],"a":2},{"t":"mcq","q":"Which word means: “above all, more than others”?","o":["exchange","especially","environmental"],"a":1},{"t":"mcq","q":"Which word means: “over greater distances”?","o":["summit","farther","connect"],"a":1},{"t":"mcq","q":"Which word means: “everything that is about the air, water or land around us”?","o":["environmental","especially","exchange"],"a":0},{"t":"mcq","q":"Which word means: “if you have gone to school and learned a lot”?","o":["farther","customer","educated"],"a":2},{"t":"gap","q":"Today ___ are made and sold all over the world, thanks to globalization.","a":"goods"},{"t":"gap","q":"A German company can ___ cars in Argentina and then sell them in the United States.","a":"produce"},{"t":"gap","q":"A businessman in Great Britain can buy a part of a company in Indonesia on one day and sell parts of another ___ in China the next, thanks to globalization.","a":"business"},{"t":"gap","q":"Since 1980, globalization has been moving at a faster ___.","a":"pace"},{"t":"gap","q":"Other people are not so sure that there are only ___.","a":"advantages"}]},{"id":"a18","day":18,"title":"Capitalism","text":"Capitalism is an economic system in which private people, not the government, own and run companies. These companies compete with other companies for business. They decide what products they want to produce, how much they should cost and where to sell them. Companies do all these things in order to make profits for their owners. People who use their money to start companies or run companies are called capitalists.\n\nEven though a pure form of capitalism does not exist and governments control the economy in some ways it remains the world’s most popular economic system. In the United States the government keeps itself out of the economy as far as possible but in some European countries economic control is much larger. Other names for capitalism are free-market economy or free enterprise.\n\nFeatures of capitalism In a capitalist system private households need goods. They buy these goods from the income that they have. Some households have more income than others. Sometimes only one member of a household has a job, at other times both husband and wife go to work. Then they have more money to buy goods. This is the demand side of the economy. On the other side companies and businesses offer private households goods and services. They produce the goods that they think consumers will want to buy. To do this they need workers to produce these goods and services. This is the supply side of the economy.\n\nCompanies and households get together at markets. Here they exchange goods, services and jobs (labour). A market is a place where people buy and sell things. In a capitalist society the prices of goods, services and labour are determined by supply and demand. If a lot of people want to buy a certain product its price will go up. Products that are mass produced usually have low prices.\n\nAnother important feature of capitalism is competition. Many companies may sell the same type of product. Companies will try to sell better products at a cheaper price so that they can get consumers to buy their products. Firms that cannot compete are very often driven out of business.\n\nThe same can be said about wages. In some cases businesses have to pay workers more money to get them to work. In other cases low paid work often exists in areas where there are more workers than are needed.\n\nHow governments regulate the economy In today’s world governments get involved in the economy in certain ways and leaders must often make economic decisions.\n\nA government must make sure that there is enough competition to keep prices low the quality products high. If only a few companies produce products they may agree to keep prices high. In a monopoly, only one company produces goods and services that everybody needs, so it can set the price.\n\nIn the second half of the 19th century companies started to get bigger and bigger by taking over smaller ones. Soon these so-called trusts had a lot of power and controlled the market and the prices. At the beginning of the 20th century the United States passed a law which helped smaller companies survive.\n\nBusiness leaders often do not care about what their decisions may do to our society. For example, a factory may pollute a river by pouring dirty water into it. It is the job of government organizations to make sure that this does not happen.\n\nThe state of economy is not the same all the time. Normally, there are always ups and downs. Sometimes the economy of a country is in good condition, everybody has enough money and lots of goods are produced. On the other side there may be years in which there are a lot of unemployed people and factories cannot sell their products. The business cycle shows the economy in four phases.\n\nSome experts believe that the government must stabilize and help the economy in bad times. It should lower taxes and interest rates so that people can borrow money more easily.\n\nIn capitalist countries some are very rich and can afford to buy everything. Others have little money and need clothing, food and a place to live. Many European countries have systems in which poor people are helped by the government and richer people have to pay more taxes etc. This system is called social market economy.\n\nHistory of capitalism Capitalism has existed since ancient times. But it became important in the 15th and 16th centuries with the growth of trade, industry and banking. Until the 1700s governments encouraged their population to make more money by selling goods to other countries. Imported goods were made more expensive so that countries could sell their own products. This became known as mercantilism.\n\nThe Industrial Revolution brought changes to the economies of many countries.\n\nFactory owners did not want governments to control trade any more. They wanted to run their companies by themselves. This idea became known as laissez-faire, which means “allow to do” in French. In his book, The Wealth of Nations, British economist Adam Smith described how laissez faire should. Great Britain became the first country to change its laws and allow free trade.\n\nDuring this period countries produced more and more products and goods and many capitalists became rich. However, normal workers did not earn very much and had to work up to 16 hours a day, sometimes in dangerous places. These problems led to the creation of trade unions, which protected workers.\n\nIn the middle of the 19 th century socialism became popular. The German Karl Marx suggested that the government should take over and control the economy. It should own all the land, the factories and companies. In a socialist economy the government tries to spread money evenly among the workers. Many countries followed these socialist ideas, which later on led to Communism.\n\nCapitalism almost collapsed during the Great Depression of the 1930s. Many banks, factories and stores had to close and millions of people lost their jobs. Many did not believe in capitalism any more. As a result the British economist John Maynard Keynes argued that the government had to do something to fight depression. In America Franklin D.\n\nRoosevelt introduced a program called New Deal in which he gave Americans help that they needed in bad times.\n\nToday Keynes’ theory is widely accepted and modern countries combine capitalism with some kind of government control. The state may own industries that are important to the country’s economy, like oil wells, banks or airlines. Most people feel that free market economy should remain but the government should still be around to see that economic rules are kept.","targets":[["afford","if you have enough money that you can buy the things you need"],["agree","if two or more people have the same opinion about something"],["argue","to say things that others don’t think are right"],["business","company"],["business cycle","the ups and downs of the economy over a certain time"],["collapse","break down"],["combine","mix"],["compete","to try to get people to buy your goods and not the ones from other companies"],["condition","same as “state “"],["consumer","someone who buys and uses products and services"],["creation","the making of"],["decision","what someone chooses to do or decides"],["demand","the need to have certain things"],["depression","when an economy almost breaks down completely"],["determine","control"],["drive out of business","if you have to stop producing things because you cannot compete with others"],["earn","to get money for the work you have done"],["economic","financial"],["economist","a person who knows a lot about how business works"],["economy","the system of producing goods and selling them"],["encourage","to tell someone they should do something that is good"],["evenly","to give everyone the same"],["exchange","to give and get things"],["exist","to be here"],["expert","person who knows a lot about something"],["factory","building where you produce goods"],["feature","the main ideas of"],["free enterprise","to allow companies and business to operate without much control"],["free trade","if you can buy and sell things freely in your country and in other countries"],["goods","things that are produced so that you can sell them"],["Great Depression","the bad times that followed the stock market crash in 1929"],["growth","development"],["income","the money you get when you have a job and work"],["interest rate","the percentage that you have to give a bank when you get money from it or the money that you get from the bank when you keep money there"],["involve","to get mixed up in ; to be a part of"],["labour","work"],["law","the set of rules a country has"],["lead to","to make something happen"],["monopoly","if one company, government or person controls everything"],["offer","to give people the things that they want"],["oil wells","large structures you use to pump oil out of the earth"],["own","to have something that belongs to you"],["pollute","to make dirty"],["pour","to make water flow into it"],["private household","people who live privately in one house"],["profit","the money you get from selling things after you have paid your costs"],["pure","unmixed, real"],["run","to be in charge of , to control"],["services","work that you do for a person or an organization"],["social market economy","economy in which the government takes more money away from richer people and helps poorer ones"],["society","people, the general public"],["spread","give"],["stabilize","to stop the economy from getting worse"],["supply","amount of goods that can be sold"],["supply and demand","difference between the amount of goods that are produced and the amount that people want to buy"],["take over","to take control of something or buy a company"],["trade","to buy and sell things"],["trade union","organization that helps workers and defends them against company owners"],["trust","a group of companies that work together so that smaller companies cannot compete with them"],["wage","money you earn in a week or month"]],"qs":[{"t":"tf","q":"“supply” means: amount of goods that can be sold","a":true},{"t":"tf","q":"“factory” means: to tell someone they should do something that is good","a":false},{"t":"tf","q":"“services” means: work that you do for a person or an organization","a":true},{"t":"tf","q":"“afford” means: unmixed, real","a":false},{"t":"tf","q":"“offer” means: to give people the things that they want","a":true},{"t":"mcq","q":"Which word means: “the making of”?","o":["exchange","creation","factory"],"a":1},{"t":"mcq","q":"Which word means: “to tell someone they should do something that is good”?","o":["feature","own","encourage"],"a":2},{"t":"mcq","q":"Which word means: “a person who knows a lot about how business works”?","o":["earn","profit","economist"],"a":2},{"t":"mcq","q":"Which word means: “unmixed, real”?","o":["pure","law","creation"],"a":0},{"t":"mcq","q":"Which word means: “same as “state “”?","o":["afford","monopoly","condition"],"a":2},{"t":"gap","q":"Companies do all these things in order to make ___ for their owners.","a":"profits"},{"t":"gap","q":"In some cases ___ have to pay workers more money to get them to work.","a":"businesses"},{"t":"gap","q":"Soon these so-called ___ had a lot of power and controlled the market and the prices.","a":"trusts"},{"t":"gap","q":"In capitalist countries some are very rich and can ___ to buy everything.","a":"afford"},{"t":"gap","q":"In his book, The Wealth of Nations, British ___ Adam Smith described how laissez faire should.","a":"economist"}]},{"id":"a19","day":19,"title":"Money","text":"Money is something that is very difficult to explain. People in various cultures think of money in different ways. A London banker and an African tribesman have different ideas of what money is.\n\nMany people think of money as a currency –metal coins and paper bills. We need it to buy the things in life that we need. We also get money for the work that we do. So, money is a way of exchanging goods and services.\n\nThe History of Money In early civilisations people did not have money. They traded objects. Maybe a hunter had more animal furs than he could use and his neighbour might have caught more fish than he could eat himself. They soon saw that they needed each other. The fisherman needed furs to protect himself from the cold and the hunter needed something to eat, so they exchanged their goods. This is called barter.\n\nBarter also had disadvantages. If there weren’t any more people who needed the hunter’s furs he couldn’t trade them for the things he needed.\n\nEarly Forms of Money As time went on, people used things that were valuable as a kind of money. Cattle was one of the earliest forms of money. People who had many cows were thought to be very rich. Later on, grain and salt were common forms of money. They had advantages because you could weigh them.\n\nThe Aztecs used cacao beans as money. They were valuable and easy to carry. The early American colonists used gunpowder, tobacco and nails as money. These things were very rare.\n\nCoins In the course of time people searched for better ways of trading goods. They found out that metal, especially gold and silver, was very valuable.\n\nSome historians believe that the first coins were made at around 700 B.C. by the Lydians. The Greeks and Romans also had silver and gold coins. Their value was guaranteed by the government.\n\nBut it was not until the late Middle Ages that coins became common throughout Europe. Metals were stamped and coins had to have a certain weight. People knew how many coins they needed to buy something because they had a fixed value.\n\nPaper money Paper money came into use about 300 years ago. The idea came from goldsmiths who gave people pieces of paper in exchange for their gold. These bills could be exchanged for their gold later on. They told you that real gold and silver existed somewhere.\n\nUntil the middle of the 20th century governments all over the world had deposits of gold that was worth as much as the money they gave to their people. Paper money had many advantages. It was cheaper to make and easier to carry around.\n\nBut there were also dangers. Governments could produce as much paper money as they wanted. If they produced too many banknotes and gave them to the people, they would have too much money to spend. If there were not enough goods to buy, prices would go up. The money then would lose its value. We call this inflation.\n\nToday, the amount of money in circulation is controlled by central banks. They make sure that paper money has a constant value.\n\nIn the second half of the 20th century people realized that they didn’t have to carry money around to buy the things they needed. Information about money was sent from bank to bank, so you could have your money transferred from one place to another without touching it.\n\nCredit cards Today, more and more people use credit cards to buy things. You don’t have to take real money with you. With a credit card the bank lends its customer money to buy something. The customer signs a small slip of paper and the shop assistant sends it to the bank and gets his money at once. A few weeks later the customer pays the money back to the bank.\n\nThe Euro In 1991 the leaders of the European Union got together in Maastricht, the Netherlands and agreed on creating a single currency for all of Europe.\n\nOn January 1,2002, the Euro became the official money in twelve of the fifteen EU nations. Only Great Britain, Sweden and Denmark wanted to stay with their old currency .\n\nIn 2004, ten central and eastern European nations joined the EU. They will decide later on if they want to join the Euro zone.\n\nWhen banks and stock exchanges began using the Euro in 1999 it was worth 1.17 US dollars. Shortly afterwards it became weaker and fell to 0.80 US dollars, but since 2002 its value has risen constantly, almost up to 1.30 US dollars.\n\nThe colourful euro banknotes were designed by the Austrian Robert Kalina.\n\nThey range from € 5 to € 500 and have a map, the EU flag, as well as arches , bridges and windows on them.\n\nThere are eight coins — ranging from 1 cent to 2 Euros. One side of the coins all look the same but on the other side each country has its own national design.\n\nPeople in favour of introducing the Euro argue that the European currency will increase trade among European countries. It could also unify the union and make it stronger. Many economic experts also predict that the Euro can compete with the US dollar as an important international currency.","targets":[["advantage","good side about something"],["afterward","after"],["agree","to say yes to something"],["amount","quantity, sum"],["arch","a building with a curved top and straight sides"],["argue","to say"],["barter","a system without money; you exchange goods for other goods"],["bill","a piece of paper money"],["came into use","to start to use"],["cattle","cows"],["central bank","a national bank that controls the money in a country"],["century","a hundred years"],["circulation","the money that all the people in a country have"],["civilisation","culture"],["coin","a round piece of metal that is used as money"],["common","if a lot of people use something"],["constant","always the same"],["course of time","as time went on"],["create","to make ; here : to introduce"],["currency","the money that a country uses"],["customer","a person who goes to a shop and buys things"],["decide","to choose"],["deposit","a safe place where you put money or a lot of gold"],["disadvantage","bad side of something"],["economic","financial"],["especially","above all"],["exchange","trade; to give someone something for something else"],["explain","to make clear; to put in simple words"],["fixed value","always worth the same"],["fur","the thick soft hair of an animal"],["goldsmith","someone who makes or sells things made of gold"],["goods","products"],["government","the people who rule a country"],["grain","seeds of corn, rice, wheat and other crops that are collected and used for food"],["guarantee","to promise something"],["gunpowder","material used to make bombs and fireworks"],["in favour","to be for something"],["increase","to go up"],["join","to become a member of"],["lend","to let someone borrow money from you"],["lose","drop, go down"],["Lydians","people who once lived in today’s Turkey"],["nail","a thin pointed piece of metal that you hit with a hammer"],["official","something that is allowed in a country"],["predict","to say that something will happen"],["protect","defend, guard"],["range","to go from … to ..."],["rare","not very often"],["real","true"],["realise","to find out"],["rise","to go up"],["services","The work that someone does for a person"],["sign","to write your name on a document or an important piece of paper"],["single currency","the money that many countries have"],["slip","piece"],["stamp","to put a sign on a coin"],["stock exchange","place where stocks or parts of a company are bought and sold"],["the design","motifs, pictures etc.."],["thought to be","said to be"],["to design","to make a drawing or plan of something"],["touch","to feel with your hand"],["trade","buying goods from and selling goods to other countries"],["tribesman","a man who is member of a big family that is ruled by one leader"],["unify","to bring together"],["valuable","worth a lot of money"],["value","what something is worth"],["various","different"],["weigh","how heavy something is"]],"qs":[{"t":"tf","q":"“bill” means: a piece of paper money","a":true},{"t":"tf","q":"“constant” means: seeds of corn, rice, wheat and other crops that are collected and used for food","a":false},{"t":"tf","q":"“rare” means: not very often","a":true},{"t":"tf","q":"“fur” means: The work that someone does for a person","a":false},{"t":"tf","q":"“lose” means: drop, go down","a":true},{"t":"mcq","q":"Which word means: “bad side of something”?","o":["rare","disadvantage","lose"],"a":1},{"t":"mcq","q":"Which word means: “seeds of corn, rice, wheat and other crops that are collected and used for food”?","o":["lend","grain","guarantee"],"a":1},{"t":"mcq","q":"Which word means: “someone who makes or sells things made of gold”?","o":["circulation","goldsmith","lydians"],"a":1},{"t":"mcq","q":"Which word means: “The work that someone does for a person”?","o":["government","tribesman","services"],"a":2},{"t":"mcq","q":"Which word means: “to become a member of”?","o":["join","bill","predict"],"a":0},{"t":"gap","q":"Money is something that is very difficult to ___.","a":"explain"},{"t":"gap","q":"If there weren’t any more people who needed the hunter’s furs he couldn’t ___ them for the things he needed.","a":"trade"},{"t":"gap","q":"They told you that ___ gold and silver existed somewhere.","a":"real"},{"t":"gap","q":"Information about money was sent from bank to bank, so you could have your money transferred from one place to another without ___ it.","a":"touching"},{"t":"gap","q":"Only Great Britain, Sweden and Denmark wanted to stay with their old ___ .","a":"currency"}]},{"id":"a20","day":20,"title":"International Trade","text":"Trade is the buying and selling of goods and services. The products that are exchanged are things that people grow or make, like food to eat, machines to work with or clothes to wear. Services are things that people do for others, like working in bank, caring for old people or teaching pupils.\n\nWhy do we trade?\n\nTrade happens because people need or want things that they don’t have. We also trade for work that we cannot do ourselves. Trade between countries happens for the same reason. Some countries, for example, have natural resources, like coal, oil or wood which other countries might want to buy. They try to sell the goods, products or services that they have too much of to other countries. They earn money from these sales and then can buy the things that they themselves need and cannot produce on their own.\n\nBoth producers and consumers profit from international trade. If countries can produce goods more cheaply than others because they specialize on them why not let them. They make more money on one side and consumers in other countries can buy goods that are cheaper.\n\nEven though many nations have a lot of different goods to export there are countries that depend only on one or two products to get money. Saudi Arabia, Kuwait and other countries of the Middle East depend on oil exports, because it is pretty much the only thing that they can sell. Poor countries in Africa depend largely on the export of tropical farm products to get money.\n\nEach year goods and services worth about 11 trillion dollars ($ 11 000 000 000 000) are traded all over the world. The biggest exporting nations are The United States, France, Germany, the United Kingdom, Canada and Japan.\n\nThe difference between what a country exports and what it imports is called the balance of trade. If a country exports more than it imports we call this a trade surplus. And if a country pays more for its imports than it gets for its exports it has a trade deficit. How trade is limited In some countries the government controls all trade and in others it allows companies and firms to trade freely. However, all governments control trade in some way.\n\nSometimes a government forbids companies to buy or sell dangerous or illegal products, or military technology. When companies expand and get bigger they often take over others and form a monopoly. Governments pass laws to prevent companies from becoming too strong and powerful and from controlling the market.\n\nMany governments try to help their own industries by making it more difficult to import foreign products. They put import taxes on foreign goods to make products more expensive and their own products cheaper. A government may also limit the number of products that it will buy from another nation. European countries, for example, may limit the number of cars that are imported from Japan or the USA. They want their people to buy European cars. We call this strategy protectionism because governments want to protect their companies and industries.\n\nHistory of trade Trading is as old as mankind. The early civilizations of Mesopotamia or Egypt traded among themselves and with other people. Gradually, trade routes developed over land and sea. These were used to transport spices, salt, minerals and jewels over great distances.\n\nIn the 15 th century Europeans started exploring the seas to find new trade routes to Asia. The Portuguese explored the coast of Africa, the Spanish, English and French set across the Atlantic and founded colonies in the New World.\n\nIn the 1700s the Industrial Revolution began in Great Britain. During the following two centuries it became the most powerful trading nation in the world. The British sold goods to its colonies and received raw materials from them.\n\nDuring this era governments did not interfere much with free trade. As a result many owners became very rich. They kept all the money themselves and paid workers badly. In the first half of the 20th century World War I and the Great Depression led to the decline of world trade. Many governments introduced new plans to help their own companies’ workers.\n\nAfter the Second World War the big countries of the free world tried to improve free trade. Some have formed trading blocs that trade freely. The biggest of them are the European Union, NAFTA and South America’s Mercosur. About 150 countries are members of the World Trade Organization, an institution that sets up rules for world trade.","targets":[["balance of trade","the difference in value between the goods that you buy an the goods that you sell"],["century","a hundred years"],["consumer","a person who buys something"],["decline","to go down"],["deficit","to have less than you need"],["depend on","to need something very much"],["distance","how far away something is"],["era","time"],["even though","while"],["exchange","to give and get something in return"],["expand","to get bigger"],["explore","to travel around an area in order to find out something about it"],["forbid","not allow"],["foreign","from another country"],["found","to setup, start"],["gradually","slowly"],["Great Depression","the economic problems that followed the Wall Street crash of 1929; it started in the USA and spread to Europe and the rest of the world; many banks and companies had to close down and people lost their jobs"],["however","but"],["illegal","against the law"],["improve","to make better"],["interfere","to get involved in"],["introduce","to show for the first time"],["jewel","a valuable stone or rock"],["largely","very much"],["law","the system of rules that a country has"],["limit","control, regulate , reduce"],["mankind","all the humans as a group"],["monopoly","a large country that controls all the sales of a product"],["owner","a person who has something"],["prevent","to stop something from happening, not to let something happen"],["protectionism","when a government tries to help its own industries by putting a tax on products that it imports"],["raw materials","things that exist in nature and that people use, like wood, coal or oil"],["receive","get"],["resources","same as “raw materials”"],["rule","an instruction that says how something must be done"],["sale","when you sell something"],["services","the work that someone does for another person or organization"],["set across","sail across"],["set up","make"],["spice","a kind of powder that you take from plants ; you put it into the food that you cook to give it a special taste"],["surplus","to have more than you need"],["take over","to control"],["tax","money that the government collects from people and uses for services"],["trade route","a way across land or sea used by traders in the past"],["trading bloc","a group of countries that trade freely with each other"],["trillion","a number with twelve zeros"]],"qs":[{"t":"tf","q":"“limit” means: control, regulate , reduce","a":true},{"t":"tf","q":"“distance” means: the system of rules that a country has","a":false},{"t":"tf","q":"“monopoly” means: a large country that controls all the sales of a product","a":true},{"t":"tf","q":"“interfere” means: from another country","a":false},{"t":"tf","q":"“consumer” means: a person who buys something","a":true},{"t":"mcq","q":"Which word means: “a valuable stone or rock”?","o":["tax","jewel","mankind"],"a":1},{"t":"mcq","q":"Which word means: “the system of rules that a country has”?","o":["law","jewel","rule"],"a":0},{"t":"mcq","q":"Which word means: “all the humans as a group”?","o":["mankind","protectionism","monopoly"],"a":0},{"t":"mcq","q":"Which word means: “from another country”?","o":["sale","prevent","foreign"],"a":2},{"t":"mcq","q":"Which word means: “a person who has something”?","o":["owner","illegal","limit"],"a":0},{"t":"gap","q":"Trade is the buying and selling of goods and ___.","a":"services"},{"t":"gap","q":"They earn money from these ___ and then can buy the things that they themselves need and cannot produce on their own.","a":"sales"},{"t":"gap","q":"And if a country pays more for its imports than it gets for its exports it has a trade ___.","a":"deficit"},{"t":"gap","q":"They put import taxes on ___ goods to make products more expensive and their own products cheaper.","a":"foreign"},{"t":"gap","q":"During the following two ___ it became the most powerful trading nation in the world.","a":"centuries"}]},{"id":"a21","day":21,"title":"The Third Man","text":"Holly Martins, an American writer of bad cowboy stories arrived in Vienna one cold morning in February. It was shortly after World War II. Vienna was in ruins and occupied by the four Allied powers, the Americans, the Russians, the British and the French. Holly Martins had been invited to Vienna by an old friend, Harry Lime, and so he was surprised that Harry was not there to meet him. When Holly went to Harry's flat he found out that his friend had been hit and killed by a truck as he was crossing the street.\n\nThe funeral was taking place that afternoon so Holly went to the cemetery. There were very few people present. A beautiful dark-haired woman was the only one of them who looked worried. After the funeral, Major Calloway, a British military policeman, told Holly that his friend Harry had been a criminal involved in illegal business but Holly did not believe him. Back at his hotel, Holly met a man who mistook him for a famous American novelist and asked him to give a lecture. Holly accepted, because this would give him a chance to stay in Vienna for a few more days and find out what really happened to Harry. The next day, Holly began his search. He first met an Austrian friend of Harry's called Kurtz. Kurtz described how he and another man, Popescu, had carried Harry's body to a square after the accident. Before he died, Harry had asked Kurtz to look after Holly and Anna. This surprised Holly because Calloway had told him that Harry’s death had been very sudden. Holly asked Kurtz about the woman at the cemetery. She was Harry's girlfriend, Anna Schmidt, an actress.\n\nThat evening, Holly met Anna and she told him more about the accident. Harry's doctor, Dr Winkel, had been passing by and had certified his death. The driver of the truck had been Harry's own driver. In fact, there had been no strangers there at all. Holly began to think that it might not have been an accident at all. The porter of Harry's flat then gave Anna and Holly another version. Harry had died immediately and three men had carried the body. So who
