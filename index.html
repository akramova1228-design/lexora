<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WordBoost</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f8;--ink:#12263a;--mut:#5b6b7e;--card:#fff;--line:#d8e0e8;--acc:#0f766e;--acc2:#f97316;--ok:#1f8f4e;--bad:#c23b2a;--hl:#ffe9a8;--hl2:#cdeee9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a22;--ink:#e8f0f5;--mut:#9db0c0;--card:#14262f;--line:#27404e;--acc:#2dd4bf;--acc2:#fb923c;--hl:#5a4a12;--hl2:#12504a}}
:root[data-theme="dark"]{--bg:#0c1a22;--ink:#e8f0f5;--mut:#9db0c0;--card:#14262f;--line:#27404e;--acc:#2dd4bf;--acc2:#fb923c;--hl:#5a4a12;--hl2:#12504a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 100px}
h1{font-size:1.5rem;font-weight:800;margin:0}h2{font-size:1.2rem;margin:0 0 8px}h3{font-size:1rem;margin:0 0 4px}
.big{font-size:2rem;text-align:center;margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:.88rem;margin:2px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px}
button,input,textarea{font:inherit;color:inherit}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}.btn.sm{padding:4px 12px;margin:0}
.btn:disabled{opacity:.4;cursor:default}
input[type=text],textarea{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px;margin:6px 0}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--acc)}
.art{font-size:1.08rem;line-height:1.9}
.w{cursor:pointer;border-radius:5px}.w.t{background:var(--hl)}.w.u{background:var(--hl2)}
.note{background:var(--hl2);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.9rem}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0;cursor:pointer}
.opt.ok,.pr.gone{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
.flash{min-height:170px;display:grid;place-items:center;text-align:center;font-size:1.7rem;font-weight:800;border:2px dashed var(--acc);border-radius:18px;padding:16px;cursor:pointer;margin-bottom:8px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr{display:block;width:100%;margin-bottom:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 8px;cursor:pointer}
.pr.sel{border-color:var(--acc2)}.pr.gone{opacity:.35}
.shake{border-color:var(--bad)}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.err{color:var(--bad);font-size:.9rem}.okm{color:var(--ok)}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(78px + env(safe-area-inset-bottom,0px));background:transparent}
#sh[hidden]{display:none}
#sh .card{box-shadow:0 -6px 30px rgba(0,0,0,.25);margin:0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:140px;border:0;border-radius:12px;background:none;padding:6px;font-size:.72rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;cursor:pointer}
nav button span{font-size:1.35rem}
nav button[aria-current=true]{background:var(--hl2);color:var(--ink)}
.w.g{border-bottom:2px dotted var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chips .chip{background:var(--hl);border:0;padding:5px 11px;font-size:.85rem;color:var(--ink);cursor:pointer}
.stage{display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.stage.lock{opacity:.5;cursor:default}.sn{font-size:1.4rem;min-width:30px;text-align:center;font-weight:800}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{border:0;border-radius:18px;padding:16px;text-align:left;color:#fff;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font:inherit}
.gc span{font-size:.8rem;opacity:.92}.gc:disabled{opacity:.4;cursor:default}
.big2{font-size:1.2rem;font-weight:600;margin:4px 0 8px}
nav[hidden]{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:.8rem;color:var(--mut)}.stat b{display:block;font-size:1.5rem;color:var(--ink)}
.art{white-space:pre-line}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 6px;font-weight:600;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
#fa{width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;font:inherit}
details.card summary{cursor:pointer;font-weight:600}details .chips{margin:10px 0 0}
.foot{text-align:center;color:var(--mut);font-size:.82rem;margin:24px 0 0}
</style>

const SEED=[{"id":"sleep","day":0,"title":"Why Sleep Matters","text":"Scientists have long argued that sleep is essential for health. During sleep the brain consolidates memories and removes harmful waste. People who regularly lack sleep often struggle to concentrate and make poor decisions. Researchers discovered that even a minor reduction in rest can impair performance at work. Adults should aim for seven to nine hours each night. To improve sleep quality, experts recommend a consistent routine, avoiding caffeine late in the day, and keeping the bedroom quiet and dark. Devices that emit bright light can disrupt the body’s natural rhythm. Although some people claim they function well on little rest, evidence suggests they underestimate the damage. A sufficient amount of sleep strengthens immunity, stabilizes mood, and enhances creativity. Therefore, treating sleep as a priority rather than a luxury is a wise investment in long-term wellbeing.","targets":[["essential","zarur"],["consolidates","mustahkamlaydi"],["harmful","zararli"],["regularly","muntazam"],["lack","yetishmaslik"],["struggle","qiynalmoq"],["concentrate","diqqatni jamlamoq"],["minor","ahamiyatsiz, kichik"],["reduction","kamayish"],["impair","zaiflashtirmoq"],["performance","samaradorlik"],["aim","maqsad qilmoq"],["recommend","tavsiya qilmoq"],["consistent","izchil, barqaror"],["avoiding","qochish"],["emit","chiqarmoq (nur)"],["disrupt","izdan chiqarmoq"],["rhythm","ritm"],["claim","da’vo qilmoq"],["evidence","dalil"],["underestimate","kam baholamoq"],["sufficient","yetarli"],["strengthens","kuchaytiradi"],["enhances","oshiradi, yaxshilaydi"],["priority","ustuvor vazifa"]],"gl":{"scientists":"olimlar","memories":"xotiralar","waste":"chiqindi","researchers":"tadqiqotchilar","decisions":"qarorlar","routine":"tartib, odat","caffeine":"kofein","devices":"qurilmalar","immunity":"immunitet","stabilizes":"barqarorlashtiradi","creativity":"ijodkorlik","luxury":"hashamat","investment":"sarmoya","wellbeing":"farovonlik"},"qs":[{"t":"tf","q":"During sleep the brain consolidates memories.","a":true},{"t":"tf","q":"A small reduction in rest cannot affect performance at work.","a":false},{"t":"tf","q":"Bright light from devices can disturb the body’s natural rhythm.","a":true},{"t":"tf","q":"People who sleep little always judge the damage correctly.","a":false},{"t":"tf","q":"The writer says sleep should be treated as a luxury.","a":false},{"t":"mcq","q":"How many hours of sleep should adults aim for?","o":["Five to six","Seven to nine","Ten to twelve"],"a":1},{"t":"mcq","q":"What is the writer’s main message?","o":["Sleep should be a priority","Caffeine is helpful at night","Bedrooms should be bright"],"a":0},{"t":"mcq","q":"What does the brain remove during sleep?","o":["Harmful waste","Useful memories","Bright light"],"a":0},{"t":"mcq","q":"Which habit do experts recommend?","o":["Drinking coffee late","A consistent routine","A bright bedroom"],"a":1},{"t":"mcq","q":"What does enough sleep improve?","o":["Only appetite","Mood and creativity","Eyesight only"],"a":1},{"t":"gap","q":"Bright light from devices can ___ the body’s natural rhythm.","a":"disrupt"},{"t":"gap","q":"Experts ___ a consistent sleep routine.","a":"recommend"},{"t":"gap","q":"Lack of sleep can ___ performance at work.","a":"impair"},{"t":"gap","q":"Sleep is ___ for good health.","a":"essential"},{"t":"gap","q":"A ___ amount of sleep strengthens immunity.","a":"sufficient"}]},{"id":"a1","day":1,"title":"Far Right Parties on the Rise in Europe","text":"The last few years have seen a rise of far right parties in Europe. These right-wing parties often have Christian values and follow nationalist movements in their countries. They are against immigration and some of them are anti-EU.\n\nEurope's far right parties have their own section inside the European Parliament. Among the most prominent are France's National Front, led by Marine Le Pen, Italy's Lega Nord, The Dutch Party of Freedom and Austria's Freedom Party.\n\nRecently, Austria's Freedom Party candidate Norbert Hofer almost became the country's first far right president, but lost narrowly to a green candidate. The Freedom Party was already in government once, between 2000 and 2006.\n\nMany other countries in Europe are witnessing the rise of far right parties. Sweden, for example, has taken a liberal stance on immigration and allowed more refugees per capita into the country than any other European nation. As a result polls show that support for the right wing Sweden Democrats has risen to 25%.\n\nOne of the strongest right-wing movements is in Hungary, where conservative Prime Minister Viktor Orban has been forced to move more and more to the right, under the pressure of the extreme Jobbik Party. Last year, he dealt with the refugee problem in his own way by building a much-criticised fence around Hungary's borders.\n\nMany political experts see German chancellor Angela Merkel as one of the reasons for a rise in support for the far right. Last year she announced that the country would welcome all refugees that wanted to come to Germany. She is strongly criticized by the Alternative for Germany, a new right-wing party that almost made it into parliament in 2013.\n\nMany people in Europe are attracted right wing movements across the continent. As refugees from the Middle East and Northern Africa are coming to Europe in masses, citizens feel their countries threatened and jobs taken away from them. There is growing concern that the EU does not have a solution for the refugee problem , thus leading to increasing Euro-scepticism in almost all EU countries.","targets":[["announce","to officially say something"],["anti-EU","against the European Union"],["attract","to make people interested in something"],["border","line between two countries"],["candidate","person who wants to be elected for an official position in a country"],["chancellor","leader of the government"],["citizen","person who lives in a country and has rights there"],["deal with","manage, find a solution for a problem"],["Euro-scepticism","a feeling that the EU is not good for the people; you want to be more independent as a country and not have the EU always telling you what to do"],["fence","structure, like a wall, that can be made out of different materials"],["far right parties","political parties that are very conservative"],["force","to make someone do something"],["government","the people who rule a country"],["growing concern","more and more people are worried"],["immigration","when people come to a country from other countries in order to live and work there"],["lead","cause"],["liberal stance","to be very liberal and not old-fashioned in your views"],["made it","to get into"],["movement","campaign; actions by a group of people"],["much-criticized","when many people do not agree with what you do"],["narrowly","only by a few votes"],["nationalist","person who wants their country to be politically independent"],["per capita","based on the number of people living in a country"],["poll","a study in which people are interviewed and asked about their opinion on a subject"],["pressure","to try to make someone do something by threatening them"],["prominent","well-known, famous"],["recently","a short time ago"],["refugee","a person who has escaped from their home country out of political or religious reasons"],["right-wing","very traditional and conservative"],["rise","to become more and more"],["solution","way to handle a problem"],["strongly","very much"],["support","to be for something"],["threaten","to believe that it will be bad for you"],["value","what someone believes in"],["witness","see, observe"]],"qs":[{"t":"tf","q":"“force” means: to make someone do something","a":true},{"t":"tf","q":"“prominent” means: to believe that it will be bad for you","a":false},{"t":"tf","q":"“border” means: line between two countries","a":true},{"t":"tf","q":"“rise” means: to be for something","a":false},{"t":"tf","q":"“narrowly” means: only by a few votes","a":true},{"t":"mcq","q":"Which word means: “campaign; actions by a group of people”?","o":["movement","prominent","threaten"],"a":0},{"t":"mcq","q":"Which word means: “to believe that it will be bad for you”?","o":["nationalist","refugee","threaten"],"a":2},{"t":"mcq","q":"Which word means: “what someone believes in”?","o":["candidate","value","narrowly"],"a":1},{"t":"mcq","q":"Which word means: “to be for something”?","o":["rise","immigration","support"],"a":2},{"t":"mcq","q":"Which word means: “to try to make someone do something by threatening them”?","o":["pressure","government","prominent"],"a":0},{"t":"gap","q":"Among the most ___ are France's National Front, led by Marine Le Pen, Italy's Lega Nord, The Dutch Party of Freedom and Austria's Freedom Party.","a":"prominent"},{"t":"gap","q":"The last few years have seen a ___ of far right parties in Europe.","a":"rise"},{"t":"gap","q":"___, Austria's Freedom Party candidate Norbert Hofer almost became the country's first far right president, but lost narrowly to a green candidate.","a":"recently"},{"t":"gap","q":"As a result ___ show that support for the right wing Sweden Democrats has risen to 25%.","a":"polls"},{"t":"gap","q":"Many political experts see German ___ Angela Merkel as one of the reasons for a rise in support for the far right.","a":"chancellor"}]},{"id":"a2","day":2,"title":"Boko Haram – Islamic Terrorists in Nigeria","text":"Boko Haram is an Islamic terrorist movement that operates out of north-eastern Nigeria. There are up to 10 000 members of the group, which wants to establish an Islamic state in Nigeria. Boko Haram is also thought to have connections with al Qaeda and the Islamic State.\n\nThe organization has been active since 2009, killing more than 5000 civilians, mainly in Nigeria’s Northern provinces. In the last five years Boko Haram have kidnapped hundreds of men, women and children, including some western tourists. By 2014 over half a million people have fled from the conflict zone to neighbouring countries.\n\nBoko Haram was founded in 2002. Violence started increasing in 2009 when its founder was killed. Since then the terrorist group has carried out numerous attacks on police buildings and other governmental organizations. Targets include politicians and religious leaders. In 2011 Boko Haram a car bomb exploded in a UN office in the capital, Abuja, killing 21 people.\n\nThe Islamic movement has been in control of a territory of about 50,000 square kilometres in northern Nigeria. Boko Haram is also active in neighbouring Chad, Niger and northern Cameroon. Islamic fighters escape the Nigerian army by retreating to these countries. The army’s attempt to fight Boko Haram has not been successful. The country’s armed forces are short of money. Some officers and soldiers are corrupt and sympathise with Boko Haram.\n\nBoko Haram is a fundamentalist movement that follows the sharia. It is against western values, especially education, and wants Nigeria’s poor people to receive a part of the country’s oil revenues. Since 2000, the sharia has been introduced by local authorities, mostly in the Islamic north of the country.\n\nSince Nigeria became independent from Great Britain in 1960 the country has been ruled by civilian governments as well as military dictators. The country is split between the poor Islamic north and the wealthier Christian south. In the past few years northern politicians have become strongly sympathetic to Boko Haram and other Islamic groups.\n\nAlthough Boko Haram has a hierarchical structure, the organization operates in cells with a few hundred fighters each. The terrorists get their money from kidnappings and are also funded by Islamic-friendly governments. Drug trafficking, smuggling and rhino poaching are other sources of income.","targets":[["armed forces","army"],["capital","the main city of a country; where the government is"],["cell","group, unit"],["civilian","a person who is not in the army"],["connection","link, relationship"],["dictator","person who has complete power over a country; in most cases they are not elected"],["drug-trafficking","buying and selling drugs"],["escape","get away from"],["establish","start, begin, set up"],["flee-fled","escape"],["found-founded","start something new"],["fund","get money from"],["fundamentalist","someone who has very strict religious beliefs"],["government","the people who rule a country"],["hierarchical","ordered"],["including","also"],["increase","to go up"],["kidnap","to take someone and hold them prisoner in order to get money for returning them"],["local authorities","the government or council that rules a small part of the land"],["mainly","mostly"],["movement","organization, group"],["numerous","many"],["officer","someone who is in a high position in the army, air force or navy"],["oil revenues","the money that a country gets from selling oil"],["operate","work out of …"],["politician","someone who works in politics or in the government"],["receive","get"],["retreat","move back to"],["rhino poaching","to hunt rhinos illegally and sell their valuable horns"],["sharia","Islamic law"],["smuggling","take something illegally from one country to another"],["soldier","person who fights for a country"],["source of income","place where you get money"],["strongly","very much"],["successful","if something works the way you want it to"],["sympathise","to support someone and help them"],["target","a person that is to be attacked"],["territory","land"],["thought to have","people think that …"],["value","idea"],["violence","fighting"]],"qs":[{"t":"tf","q":"“civilian” means: a person who is not in the army","a":true},{"t":"tf","q":"“capital” means: someone who has very strict religious beliefs","a":false},{"t":"tf","q":"“operate” means: work out of …","a":true},{"t":"tf","q":"“movement” means: person who fights for a country","a":false},{"t":"tf","q":"“kidnap” means: to take someone and hold them prisoner in order to get money for returning them","a":true},{"t":"mcq","q":"Which word means: “get away from”?","o":["escape","connection","smuggling"],"a":0},{"t":"mcq","q":"Which word means: “someone who has very strict religious beliefs”?","o":["soldier","capital","fundamentalist"],"a":2},{"t":"mcq","q":"Which word means: “move back to”?","o":["fund","officer","retreat"],"a":2},{"t":"mcq","q":"Which word means: “person who fights for a country”?","o":["soldier","target","cell"],"a":0},{"t":"mcq","q":"Which word means: “the people who rule a country”?","o":["government","target","operate"],"a":0},{"t":"gap","q":"There are up to 10 000 members of the group, which wants to ___ an Islamic state in Nigeria.","a":"establish"},{"t":"gap","q":"In the last five years Boko Haram have kidnapped hundreds of men, women and children, ___ some western tourists.","a":"including"},{"t":"gap","q":"By 2014 over half a million people have ___ from the conflict zone to neighbouring countries.","a":"fled"},{"t":"gap","q":"In 2011 Boko Haram a car bomb exploded in a UN office in the ___, Abuja, killing 21 people.","a":"capital"},{"t":"gap","q":"The army’s attempt to fight Boko Haram has not been ___.","a":"successful"}]},{"id":"a3","day":3,"title":"Gaza – Israel Conflict","text":"The violent battle between Israel and Palestinians in Gaza is part of the Arab-Israeli conflict, which has been going on for decades. After Israel was founded in 1948, millions of Palestinians fled their homelands and settled in the West Bank and the Gaza Strip. At that time, Gaza belonged to Egypt. In 1967, Israel occupied the area after the 6-Day War. In the decades that followed, several conflicts have arisen between Palestinians and Israelis. The Gaza Strip is a 25 mile-long area on the Mediterranean coast. Most of its 1.8 million people live in extreme poverty. Infrastructure is weak; food and electricity are often scarce. Over 40% of the Palestinians are unemployed because they cannot find any work in Gaza. Some of them travel across the border to work in Israel.\n\nThe United Nations manages almost half of the schools in Gaza, but more are needed to deal with the rise in population, which is expected to grow to over 2 million by 2020. The UN also says that more and more houses and apartments are needed for people who have lost their homes during Israeli air strikes.\n\nIn 2005, Israel decided to withdraw their army from the Gaza Strip in an attempt to allow Palestinians to rule themselves. It also pulled out 5000 Israelis, who settled in the region. Shortly afterwards, a terrorist organization called Hamas took power after winning general elections. Hamas does not recognise Israel as a sovereign state and wants to destroy the Jewish country. Its aim is to give Palestinians their old homeland back.\n\nIn the last few years, Israel has led an all-out war against Hamas. It controls what gets in and out of Gaza at the border crossings in the east and north. Israel has set up land and sea blockades to protect itself and controls the airspace over Gaza. Egypt has closed its own border with Gaza because it is afraid that hundreds of thousands will flee to the Arab country.\n\nHamas does not have a regular army, however terrorists constantly fire rockets into Israel, mostly from a system of tunnels that they have built. This draws Israel more and more into an armed conflict, seeking revenge for Israeli civilians who have been killed.\n\nIsrael’s airstrikes have not only destroyed Hamas’ military command posts but also killed thousands of innocent civilians.\n\nWestern countries, including the United States and the European Union have been working hard at achieving a peaceful way to solve the crisis. One solution would be to turn Gaza and the West Bank into a sovereign Palestinian state; however, this is rejected by Israel, as long as Hamas controls much of the region.","targets":[["achieve","reach, do"],["airspace","the sky over a country"],["airstrike","attack a place from the air"],["all-out","with a lot of energy"],["arise – arose – arisen","come up, start"],["armed","with guns, rockets and other things used to fight in a war"],["blockade","when you put soldiers or ships in a place to stop people or goods from getting in or out"],["border","line between two countries"],["border crossing","place where you can travel from one country to another"],["civilian","person who is not a soldier or in the army"],["coast","place where land meets the sea"],["command post","place from which military leaders control a fight or war"],["deal with","manage"],["draw","pull"],["electricity","power that is in wires or cables and is used to make light and heat"],["flee – fled","escape from a dangerous situation"],["found – founded","to start something new; here: to create a new country"],["general election","when all of the people in a country vote for a government or parliament"],["homeland","home; place where you or your family have lived for a long time"],["infrastructure","systems that a country needs in order to function, for example roads, bridges, schools, hospitals etc.."],["innocent","harmless"],["lead – led","fight"],["manage","control, run, operate"],["occupy","to enter a country and control it with an army"],["poverty","the situation of being poor"],["pull out","take out of"],["recognise","accept"],["reject","to say no; to be against something"],["revenge","something you do to punish a person or group that has attacked you"],["rule","govern"],["scarce","limited, not enough of"],["seek","look for"],["settle","to move to another place and live there"],["several","many"],["shortly afterwards","a short time later"],["solution","answer, way out of a problem"],["solve","find an answer to something"],["sovereign","independent, free"],["unemployed","out of work"],["withdraw","pull out of an area"]],"qs":[{"t":"tf","q":"“settle” means: to move to another place and live there","a":true},{"t":"tf","q":"“armed” means: limited, not enough of","a":false},{"t":"tf","q":"“withdraw” means: pull out of an area","a":true},{"t":"tf","q":"“electricity” means: place where land meets the sea","a":false},{"t":"tf","q":"“border” means: line between two countries","a":true},{"t":"mcq","q":"Which word means: “person who is not a soldier or in the army”?","o":["civilian","occupy","settle"],"a":0},{"t":"mcq","q":"Which word means: “limited, not enough of”?","o":["electricity","scarce","civilian"],"a":1},{"t":"mcq","q":"Which word means: “find an answer to something”?","o":["civilian","solve","revenge"],"a":1},{"t":"mcq","q":"Which word means: “place where land meets the sea”?","o":["airstrike","coast","blockade"],"a":1},{"t":"mcq","q":"Which word means: “attack a place from the air”?","o":["airstrike","solve","settle"],"a":0},{"t":"gap","q":"In 1967, Israel ___ the area after the 6-Day War.","a":"occupied"},{"t":"gap","q":"The Gaza Strip is a 25 mile-long area on the Mediterranean ___.","a":"coast"},{"t":"gap","q":"Most of its 1.8 million people live in extreme ___.","a":"poverty"},{"t":"gap","q":"Over 40% of the Palestinians are ___ because they cannot find any work in Gaza.","a":"unemployed"},{"t":"gap","q":"Some of them travel across the ___ to work in Israel.","a":"border"}]},{"id":"a4","day":4,"title":"Israel Settlements","text":"Since Israel occupied the West Bank, East Jerusalem and the Golan Heights during the Six Day War of 1967 they have been building settlements for Jewish settlers in this region. There were also new towns in Gaza but Israel called all settlers back in 2005. Although the peace accord signed with the PLO in Oslo prohibited the building of new settlements the Israeli government is continuing to grant their construction.\n\nThe international community regards these settlements as illegal and the United Nations has repeatedly condemned the Jewish state for building them. The Jewish settlements in the occupied territories are one reason why peace talks between Israel and the Palestinians are at a standstill. Amnesty International and other human rights organizations argue that constructing settlements on the Palestinian territory is a violation of human rights.\n\nToday, about 350 000 settlers live in over a hundred settlements in the West Bank. Another 300,000 live in East Jerusalem, 20,000 live on the Golan Heights. Some of the settlements are recently built small cities with their own infrastructure, urban services and transportation; others have been built in the suburbs of big cities like Hebron. Recently the Israeli government has authorized the construction of four new settlements in the occupied West Bank.\n\nOriginally the Jewish settlements were constructed in order to stop Palestinians from obtaining their own state and to establish a buffer zone between Israel and its Arab neighbors.\n\nSettlers have largely come to the region for economic reasons. Israel’s government offers certain bonuses to people who are willing to settle there. Goods produced in the West Bank and East Jerusalem are subsidized by the government. Tax cuts and other economic incentives motivate Israelis to move to the occupied territories. On the other side there are religious fanatics who believe they are returning to their biblical homeland. They regard Arabs as aliens in their country.\n\nMost new settlers enjoy the advantages of their new home. While Israeli settlements offer jobs to Palestinians who would otherwise be unemployed, there is regular tension between settlers and Arabs.\n\nMany settlements are built on the best farming land. Palestinians accuse Israelis of consuming too much water and leaving them only little. Reports of violence on the side of settlers who lash out at Palestinians are not uncommon.\n\nThe future of the Jewish settlements is only one issue that needs to be resolved in order to achieve a lasting peace agreement in the Middle East. Other issues are the future of Jerusalem and the borders between Israel and a new Palestinian state.","targets":[["accuse","blame; to say something is your fault"],["advantage","the good side of something"],["alien","foreigner"],["although","while"],["argue","to disagree with someone; to give clear reasons about your opinion"],["authorize","allow"],["biblical","written in the Bible"],["border","line between two countries"],["buffer zone","area that protects you from enemies"],["community","all the people in the world"],["condemn","criticize; to say that something is wrong"],["economic","about industry, trade and money"],["establish","create"],["goods","products"],["government","the people who rule a country"],["grant","allow"],["human rights","the basic rights that everyone should have"],["incentive","something that gives you a reason to work harder or do something"],["infrastructure","schools, hospitals, roads etc..; things that a city needs to exist"],["lash out","to show anger towards someone"],["lasting","permanent"],["occupy","to enter a place with an army and take control of it"],["originally","at first"],["otherwise","or else"],["peace agreement","a document that ends a conflict or a war"],["PLO","Palestine Liberation Organization = political group of Palestinians who want their own state"],["prohibit","ban, stop, not allow"],["regard","look upon, consider"],["resolve","solve, decide"],["settlement","group of houses or buildings in a place where not many people have lived before"],["sign","to put your name on a document"],["standstill","stop, not go on"],["subsidize","when the government gives money to a company to produce something"],["suburb","area of the city that is far away from the centre"],["tax cuts","lower taxes"],["tension","conflict, problems"],["uncommon","happen often"],["unemployed","without work"],["violation","action that is against the law"]],"qs":[{"t":"tf","q":"“regard” means: look upon, consider","a":true},{"t":"tf","q":"“accuse” means: about industry, trade and money","a":false},{"t":"tf","q":"“incentive” means: something that gives you a reason to work harder or do something","a":true},{"t":"tf","q":"“biblical” means: line between two countries","a":false},{"t":"tf","q":"“violation” means: action that is against the law","a":true},{"t":"mcq","q":"Which word means: “the good side of something”?","o":["condemn","government","advantage"],"a":2},{"t":"mcq","q":"Which word means: “about industry, trade and money”?","o":["government","advantage","economic"],"a":2},{"t":"mcq","q":"Which word means: “criticize; to say that something is wrong”?","o":["suburb","plo","condemn"],"a":2},{"t":"mcq","q":"Which word means: “line between two countries”?","o":["suburb","border","prohibit"],"a":1},{"t":"mcq","q":"Which word means: “ban, stop, not allow”?","o":["violation","condemn","prohibit"],"a":2},{"t":"gap","q":"Today, about 350 000 settlers live in over a hundred ___ in the West Bank.","a":"settlements"},{"t":"gap","q":"Settlers have largely come to the region for ___ reasons.","a":"economic"},{"t":"gap","q":"Israel’s ___ offers certain bonuses to people who are willing to settle there.","a":"government"},{"t":"gap","q":"On the other side there are religious fanatics who believe they are returning to their ___ homeland.","a":"biblical"},{"t":"gap","q":"Most new settlers enjoy the ___ of their new home.","a":"advantages"}]},{"id":"a5","day":5,"title":"Nuclear Weapons","text":"The nuclear weapons race started at the end of World War II when the United States dropped two atomic bombs over Japan. Since then several countries have produced their own nuclear devices and others are working hard on their production.\n\nThe United States Nuclear testing began during World War II and ended in the early 1990s after the collapse of Communism. The United States still has the most operational warheads (over 2000), while there are still thousands that are being dismantled. The Americans also have nuclear weapons stationed in other NATO countries. Together with Russia, the US is the only member of the atomic weapons club that has air-, sea- and land-based nuclear weapons. For two decades the United States has been working together with Russia to reduce the number of nuclear weapons around the world.\n\nRussia Russia conducted its first nuclear test in 1949, four years after the Americans bombed Hiroshima and Nagasaki. During the Cold War the arms race led to a proliferation of nuclear weapons. Today, Russia has about 1,700 operational warheads. Nuclear experts, however, are worried that after 1990 some warheads might have fallen into the hands of third parties and are thus, not accounted for.\n\nGreat Britain The UK joined the nuclear club in 1951 and has about 160 warheads that can only be delivered by submarines.\n\nFrance France is the third largest nuclear power after the US and Russia. The country can fire its 300 warheads either from air or sea.\n\nChina Communist China started a nuclear program in the 1950s after the United States moved some of their own warheads to Asia during the Korean War. Currently China can deploy land- and air-based missiles, and may shortly be able to put them on submarines.\n\nIndia India tested its first nuclear weapon in 1974 because it saw neighboring China and Pakistan as a major threat to the region. India has land and air based weapons that can be made operational at short notice.\n\nPakistan After conflicts and regional wars with India in the last forty years Pakistan tested its first warhead in 1998 and is said to have 100 warheads.\n\nIsrael Although Israel has never confirmed the testing of atomic weapons, experts believe that the country has had a nuclear weapons program for decades. Israel probably has at least 80 missiles on land that can deliver nuclear warheads.\n\nNorth Korea In the last few years North Korea has been conducting underground tests. Western experts think that the Communist state has enough plutonium to build atomic bombs but they doubt whether it can deliver them on missiles. Sanctions against the country took effect some years ago after talks to stop the program had failed .\n\nIran The western world is also worried about Iran’s plans to build a nuclear bomb. The International Atomic Energy Commission claims it has serious proof that Iran is producing plutonium to build a bomb. Iranian leaders have repeatedly said that they are only enriching uranium for nuclear energy. The United Nations has put sanctions on the country in an attempt to stop Iran’s program.\n\nSeveral other states at one time had a nuclear weapons program or already had produced warheads. States of the former Soviet Union, including Ukraine and Kazakhstan possessed nuclear warheads when the country broke apart, but returned them to Russia in the following years. South Africa developed nuclear weapons during the Apartheid years but stopped it in the 1990s. Saddam Hussein was thought of developing his own nuclear weapons in Iraq. In 2003 the United States invaded the country because they thought the dictator had weapons of mass destruction. Argentina, Brazil and South Korea stopped their nuclear weapons programs many years ago.","targets":[["account for","to say where they are"],["although","while"],["Apartheid","the political and social system of South Africa in the 20th century; whites had all the power and other groups, especially blacks were forced to live in separate areas, go to separate schools etc.."],["arms race","when two or more countries compete for the largest number of weapons"],["at short notice","within a short time"],["based","to be fired from"],["Cold War","the unfriendly relationship between the Soviet Union and the United States after World War II"],["conduct","carry out"],["confirm","to show that something is true"],["currently","right now"],["decade","ten years"],["deliver","transport"],["deploy","set up; make something work"],["develop","produce , make, plan"],["device","bomb"],["dismantle","take apart"],["enrich","to increase the number of atoms so that a substance can produce more power"],["fail","not succeed"],["former","earlier, ex-"],["nuclear weapon","powerful bomb that uses nuclear energy to kill many people and destroy large areas"],["operational","ready, working"],["plutonium","radioactive metal that is used to produce nuclear weapons"],["possess","own, have"],["proliferation","increase; large number"],["proof","evidence, facts"],["reduce","lower"],["repeatedly","over and over again"],["sanction","order to stop trade or punish a country in certain ways to force their leaders to change their political opinion"],["serious","real"],["several","many"],["shortly","in the near future"],["threat","danger"],["took effect","start"],["underground","under the surface of the Earth"],["warhead","the front part of a missile that explodes when ti hits something"],["weapons of mass destruction","chemical, nuclear or biological weapons that are very dangerous and can kill thousands of people"]],"qs":[{"t":"tf","q":"“operational” means: ready, working","a":true},{"t":"tf","q":"“enrich” means: increase; large number","a":false},{"t":"tf","q":"“plutonium” means: radioactive metal that is used to produce nuclear weapons","a":true},{"t":"tf","q":"“warhead” means: not succeed","a":false},{"t":"tf","q":"“confirm” means: to show that something is true","a":true},{"t":"mcq","q":"Which word means: “evidence, facts”?","o":["fail","proof","dismantle"],"a":1},{"t":"mcq","q":"Which word means: “increase; large number”?","o":["proliferation","plutonium","dismantle"],"a":0},{"t":"mcq","q":"Which word means: “earlier, ex-”?","o":["former","repeatedly","enrich"],"a":0},{"t":"mcq","q":"Which word means: “not succeed”?","o":["former","based","fail"],"a":2},{"t":"mcq","q":"Which word means: “to be fired from”?","o":["repeatedly","warhead","based"],"a":2},{"t":"gap","q":"Russia Russia ___ its first nuclear test in 1949, four years after the Americans bombed Hiroshima and Nagasaki.","a":"conducted"},{"t":"gap","q":"Since then ___ countries have produced their own nuclear devices and others are working hard on their production.","a":"several"},{"t":"gap","q":"Nuclear experts, however, are worried that after 1990 some ___ might have fallen into the hands of third parties and are thus, not accounted for.","a":"warheads"},{"t":"gap","q":"Pakistan After conflicts and regional wars with India in the last forty years Pakistan tested its first ___ in 1998 and is said to have 100 warheads.","a":"warhead"},{"t":"gap","q":"Western experts think that the Communist state has enough ___ to build atomic bombs but they doubt whether it can deliver them on missiles.","a":"plutonium"}]},{"id":"a6","day":6,"title":"Kashmir","text":"Kashmir is a mountainous region in the Himalaya Mountains between India and Pakistan. It has been a conflict region for over 60 years, ever since the Indian subcontinent became independent.\n\nIn 1947, after Great Britain had withdrawn from south Asia, India and Pakistan became independent countries. The Maharaja of Kashmir decided to become a part of India, in return for Indian protection. In the past 60 years India and Pakistan have fought three wars over the region.\n\nAlthough there has been less violence in the region recently, it is still a trouble spot. A minor conflict could trigger a war between India and Pakistan, both nuclear powers in the region.\n\nKashmir is the only region within India with an Islamic majority. Many people do not want to be governed by India. They want to become a part of Pakistan or be independent altogether. The people think that they are being discriminated against by the government in Delhi. Unemployment is running high and they claim they are not getting the help they need.\n\nIn the 1990s there have been many incidents along the borderline in Kashmir between Indian and Pakistani armed forces. However, in the last decade, there have been signs of improving relationships. In 2006 Pakistan stopped giving money to paramilitary groups fighting in Kashmir and two years ago India announced that it would grant amnesty to Pakistani freedom fighters.\n\nToday Kashmir is controlled by three countries. The east and south with a population of 9 million are controlled by India; Pakistan administers the north and the west, while China also controls a small region.\n\nMany officials in both India and Pakistan want peace, because both countries are tired of the decade long conflict. They also think that a lasting peace will bring stability and economic growth to a war-torn region. But in both countries there are extremist groups that do not want their governments to give in and make peace.","targets":[["administer","govern, control"],["although","while"],["amnesty","to let prisoners go free"],["announce","to say officially"],["armed forces","army"],["borderline","where two countries meet"],["claim","to say that’s something is true"],["decade","a period of ten years"],["decide","choose"],["discriminate against","to treat someone in an unfair way or differently from someone else"],["freedom fighter","person who wants their country or land to become independent"],["govern","rule"],["grant","give"],["improve","get better"],["in return for","in exchange for"],["incident","events, things that happen"],["independent","free"],["less","not that much"],["Maharaja","an Indian prince or king"],["majority","most of the people in a group"],["minor","small"],["paramilitary","illegal group that is organized like an army"],["protection","guard, security"],["recently","in the last few years"],["sign","signal"],["trigger","start"],["unemployment","the situation of being out of work"],["withdraw","pull back, get out of"]],"qs":[{"t":"tf","q":"“announce” means: to say officially","a":true},{"t":"tf","q":"“withdraw” means: a period of ten years","a":false},{"t":"tf","q":"“borderline” means: where two countries meet","a":true},{"t":"tf","q":"“unemployment” means: get better","a":false},{"t":"tf","q":"“administer” means: govern, control","a":true},{"t":"mcq","q":"Which word means: “most of the people in a group”?","o":["majority","claim","amnesty"],"a":0},{"t":"mcq","q":"Which word means: “a period of ten years”?","o":["borderline","decade","unemployment"],"a":1},{"t":"mcq","q":"Which word means: “not that much”?","o":["decade","administer","less"],"a":2},{"t":"mcq","q":"Which word means: “get better”?","o":["amnesty","improve","decade"],"a":1},{"t":"mcq","q":"Which word means: “guard, security”?","o":["borderline","protection","recently"],"a":1},{"t":"gap","q":"It has been a conflict region for over 60 years, ever since the Indian subcontinent became ___.","a":"independent"},{"t":"gap","q":"In 1947, after Great Britain had withdrawn from south Asia, India and Pakistan became ___ countries.","a":"independent"},{"t":"gap","q":"Kashmir is the only region within India with an Islamic ___.","a":"majority"},{"t":"gap","q":"Many people do not want to be ___ by India.","a":"governed"},{"t":"gap","q":"They want to become a part of Pakistan or be ___ altogether.","a":"independent"}]},{"id":"a7","day":7,"title":"Refugees","text":"Refugees are people who have fled from their country because of wars, political or religious conflicts or because they fear persecution from governments. Displaced people have lost their home but they remain in their own country.\n\nOfficially there are about 12 million refugees today. The peak was reached during the Balkan conflict of the 1990s, when almost 18 million people were refugees. About 70 % of the world’s refugee population is in Africa and the Middle East.\n\nOver 800,000 people flee from their homes and become refugees every year. Most of them escape wars and conflicts in Africa and the Middle East. During 2011 thousands fled from North African dictatorships during what was called the Arab Spring. During 1994 hundreds of thousands of Rwandans escaped the genocide and terror in their country. Afghanistan is the country with the most refugees, almost 3 million. Most Afghani refugees go to Pakistan. Germany is home to over 500, 000 Afghan citizens and over a quarter of a million have come to the United States.\n\nOver one million people have left Iraq and Somalia. Sudan and Congo have about half a million refugees each. The United Nations also states there are over 10 million stateless people around the world, Kurds or Palestinians who do not belong to a certain country.\n\nPeople do not become refugees only because of war or other political conflicts.\n\nAs drought continues in the Horn of Africa over 12 million people are thought to be homeless or in refugee camps.\n\nOn the whole over 40 million people are considered to be homeless worldwide, according to the United Nations, mostly because of new conflicts . They are likely to stay refugees and not be able to go back to their homelands any time soon.\n\nWho is a Refugee?\n\nInternational law defines a refugee as a person who has fled from their homeland and cannot come back for many reasons. They are protected by the Geneva convention, which makes sure such people are not forced to return to the country they have fled from. Protecting refugees around the world is done by the UNHCR (UN High Commissioner for Refugees). The organization tries to help them get back to the country of their origin, if possible. It also helps them seek asylum or integrate in the country they have fled to. Many countries do not always give refugees the same rights that they give their legal citizens.\n\nToday, it is hard to keep refugees apart from economic immigrants, those who leave their home country voluntarily to go somewhere else in search of a better life and more income.\n\nMajor refugee movements in history Refugees have always been a part of history. In the Middle Ages people became refugees because they did not agree with the religion of their country. Roman Catholics made Jews leave Spain, French Catholics expelled Protestants from France. During the Russian Revolution about 1.5 million people left their country because they were against Communism. Over a million Armenians fled Turkey because they were in fear of being persecuted.\n\nBy the end of World War II there were over 50 million refugees and displaced people in Europe alone. Many were Jews who fled Nazi leaders in Germany. Germans also had to leave areas where they had settled before the war.\n\nWhen a Communist government took over China in 1949 two million people fled to Hong Kong and Taiwan. In 1947 almost 20 million Muslims and Hindus had to cross borders between India and the new state of Pakistan.\n\nAfter World War II over 3 million East Germans escaped to West Germany.\n\nThe movement was halted in 1961 when the Berlin Wall was built.","targets":[["agree","to share the same opinion"],["apart","separate"],["certain","special"],["citizen","a person who lives in a country and has rights there"],["considered","thought"],["convention","written document that gives someone rights"],["cross","move"],["dictatorship","a country in which one person rules without a parliament"],["displaced","if you have lost your home and have to move somewhere else in your own country"],["drought","a long period of dry weather with little or no rain"],["expel","to drive out of"],["fear","to be afraid of"],["flee – fled","escape from a dangerous situation"],["force","have to"],["genocide","the mass murder of a whole group of people"],["government","the people who rule a country"],["halt","stop"],["Horn of Africa","the part of East Africa that includes Somalia and some of Ethiopia"],["immigrant","a person who leaves their country and go to another country"],["in fear of","afraid"],["income","the money you get for the work you do"],["integrate","mix with other people"],["Jew","person whose religion is Judaism"],["law","the rules of a country"],["legal","lawful"],["likely","probably"],["movement","people who wanted to do the same things or had the same ideas"],["officially","formally"],["origin","starting point; where you come from"],["peak","the highest point"],["persecution","to treat someone unfairly or in a violent way, because they think differently or have a different religion"],["protect","defend, guard"],["reach","get to, arrive at"],["refugee camp","a place where refugees can stay for some time"],["remain","stay"],["seek asylum","to ask another country if you can live there because you had to leave your own country because of political reasons"],["settle","to start living in a place"],["state","to say officially"],["stateless","without belonging to a country"],["take over","start controlling"],["voluntarily","out of your own free will"]],"qs":[{"t":"tf","q":"“state” means: to say officially","a":true},{"t":"tf","q":"“agree” means: written document that gives someone rights","a":false},{"t":"tf","q":"“immigrant” means: a person who leaves their country and go to another country","a":true},{"t":"tf","q":"“displaced” means: starting point; where you come from","a":false},{"t":"tf","q":"“peak” means: the highest point","a":true},{"t":"mcq","q":"Which word means: “to drive out of”?","o":["expel","income","genocide"],"a":0},{"t":"mcq","q":"Which word means: “written document that gives someone rights”?","o":["peak","displaced","convention"],"a":2},{"t":"mcq","q":"Which word means: “to start living in a place”?","o":["settle","movement","citizen"],"a":0},{"t":"mcq","q":"Which word means: “starting point; where you come from”?","o":["expel","protect","origin"],"a":2},{"t":"mcq","q":"Which word means: “the people who rule a country”?","o":["displaced","protect","government"],"a":2},{"t":"gap","q":"___ there are about 12 million refugees today.","a":"officially"},{"t":"gap","q":"During 1994 hundreds of thousands of Rwandans escaped the ___ and terror in their country.","a":"genocide"},{"t":"gap","q":"They are ___ to stay refugees and not be able to go back to their homelands any time soon.","a":"likely"},{"t":"gap","q":"The organization tries to help them get back to the country of their ___, if possible.","a":"origin"},{"t":"gap","q":"In the Middle Ages people became refugees because they did not ___ with the religion of their country.","a":"agree"}]},{"id":"a8","day":8,"title":"Myanmar","text":"Myanmar, once called Burma, has been one of the most isolated countries in the world. However, since March 2011, when Myanmar’s first civilian government in decades took office, it has been moving towards democracy, if only one small step at a time.\n\nAfter decades of authoritarian rule, Myanmar’s military has decided to step down from power. Most generals have realized that the country has, economically, fallen behind their neighbors. They have decided to open themselves to the western world and end the economic sanctions that have been in place for some time. Many citizens in Myanmar, however, are skeptical. They think that once the country has been accepted in the west the political tide will turn against them.\n\nIn the last 5 decades Myanmar has developed into one of the most backward countries in Asia. Its people are among the poorest. Schools do not have enough teachers and some universities have been closed because of possible student unrest. Buildings need to be repaired , most of the infrastructure is old-fashioned and goes back to British colonial rule. Many Burmese fled the country and are living in exile somewhere else.\n\nAll over the country signs of democracy have emerged. Hundreds of political prisoners have been set free. Myanmar’s media has received more freedom, although it is still controlled by the government.\n\nThe government is allowing trade unions to form. Environmental and human rights organizations have sprung up all over the country. People are not scared of the military any more. They actually believe in democratic reforms and that their life is about to change for the better.\n\nThe military leaders have released Myanmar’s most prominent opposition leader, Aung San Suu Kyi, from house arrest after 15 years. She is a very popular figure in the country, mainly because her father was one of the founders of the Burmese army and was killed shortly before the country got its independence from Great Britain in 1948. She won the Nobel Peace Prize for her fight against military leaders in 1991. The opposition leader hopes that the military will help her change the face of Burma.\n\nAung San Suu Kyi wants to wake up her people and tell them that the time has come to take responsibility for their future. Her party, the National League for Democracy, was not allowed to take part in the general election of 2010 but will play a role in future elections in Myanmar.\n\nOf the many problems that face the new government in Burma, two stand out. For over 15 years Myanmar’s leaders have been looking to China for help, especially after economic sanctions had been placed on them. Chinese businessmen and companies have invested heavily in Myanmar. And the Chinese have also supplied the military junta with weapons. In return the Chinese were allowed to build a vital pipeline through Myanmar, which transports oil and gas back to Central China.\n\nMyanmar has strained its relationship with China, especially after a contract for a hydroelectric power station near the China-Burmese border had been signed. Critics say that most of the electricity will go to China while Burma itself will profit only little. On the other side China has warned Myanmar not to open up too much to western influence. Another problem that the government faces is the conflict with its ethnic minorities, which make up a third of the population. Political experts claim that peace and stability will come to the Southeast Asian country only if it can settle the disputes with its minorities.\n\nEven though there are signs of Myanmar’s new direction towards democracy, many things need to be done before the west is willing to invest large amounts of money in the country. Mobile phone connections lag behind, the Internet is very slow and banking system is out- of-date. Railroads, airports and roads desperately need overhauling. But western countries, nevertheless, are keeping an eye on Myanmar. It has oil and gas reserves, as well as timber and valuable metals. With a population of 60 million it is one of the big markets in Asia.","targets":[["amount","sum"],["authoritarian rule","a government that tells people what to do and punishes them if they do not obey the laws, especially those that are wrong or unfair"],["backward","developing very slowly or not at all"],["citizen","a person who lives in a country and has rights there"],["claim","to say officially"],["colonial rule","when a European country controls an area far away"],["contract","a written agreement"],["desperately","very much"],["dispute","conflict, problem"],["economically","about the economy"],["emerge","come up"],["ethnic minority","a group of people of a different race from the main group who lives in a country"],["exile","a situation in which you must leave your country for political reasons"],["face","deal with"],["for the better","to improve"],["founder","a person who started something"],["future","coming"],["general election","an election in which all the people of a country can vote"],["heavily","very much"],["house arrest","to be kept as a prisoner in your own house"],["human rights","the basic rights that everyone should have, like the right to vote or the   18 right to say what you want"],["hydroelectric power station","a building that produces electricity from water power"],["in place","in effect"],["independence","freedom"],["infrastructure","basic systems that a country needs, like transportation, schools, banks etc…"],["isolated","cut off"],["lag","not as good as"],["little","not very much"],["media","radio, television and newspapers"],["military","army"],["military junta","government of army officers who have not been elected by the people"],["nevertheless","but"],["open up","when you let the people have more rights and freedom"],["out-of-date","not modern; something that should not be used anymore"],["overhaul","changes that have to be made in order for something to work"],["political prisoner","someone who is locked up because they have opposed the government or have criticized it"],["prominent","famous"],["realize","to find out"],["release","to set free"],["responsibility","to be in control and make decisions"],["sanction","an official order that stops trade between two countries, as a way of forcing a country’s leaders to make political changes"],["sign","mark, signal"],["sign","to put your name on a document"],["skeptical","doubtful, not sure"],["stability","the situation of being stable; not change"],["stand out","are most important"],["step down","give up; let someone else take over"],["strain","to cause problems"],["supply","provide, give"],["tide","the way in which people’s opinions are developing"],["timber","trees that produce wood"],["towards","in a certain direction"],["trade union","organization that represents workers and their rights"],["unrest","conflict"],["valuable","expensive, important"],["vital","very important"]],"qs":[{"t":"tf","q":"“overhaul” means: changes that have to be made in order for something to work","a":true},{"t":"tf","q":"“tide” means: developing very slowly or not at all","a":false},{"t":"tf","q":"“claim” means: to say officially","a":true},{"t":"tf","q":"“stability” means: very important","a":false},{"t":"tf","q":"“towards” means: in a certain direction","a":true},{"t":"mcq","q":"Which word means: “provide, give”?","o":["supply","claim","timber"],"a":0},{"t":"mcq","q":"Which word means: “developing very slowly or not at all”?","o":["backward","infrastructure","supply"],"a":0},{"t":"mcq","q":"Which word means: “to find out”?","o":["infrastructure","claim","realize"],"a":2},{"t":"mcq","q":"Which word means: “very important”?","o":["tide","exile","vital"],"a":2},{"t":"mcq","q":"Which word means: “not very much”?","o":["media","sign","little"],"a":2},{"t":"gap","q":"Myanmar, once called Burma, has been one of the most ___ countries in the world.","a":"isolated"},{"t":"gap","q":"They think that once the country has been accepted in the west the political ___ will turn against them.","a":"tide"},{"t":"gap","q":"Schools do not have enough teachers and some universities have been closed because of possible student ___.","a":"unrest"},{"t":"gap","q":"Myanmar’s ___ has received more freedom, although it is still controlled by the government.","a":"media"},{"t":"gap","q":"She won the Nobel Peace Prize for her fight against ___ leaders in 1991.","a":"military"}]},{"id":"a9","day":9,"title":"Arab Spring","text":"A wave of demonstrations and protests has been going on in many Arab countries of the Middle East and Northern Africa since the end of 2010.\n\nRevolutions have taken place in Tunisia and Egypt. In both Arab countries leaders had to resign and transfer their power. In Libya a civil war went on for months in an attempt to overthrow Muammar Gaddafi. In many other Arab countries, like Bahrain and Syria there have been uprisings against the government.\n\nThe protests, which became known as “Arab Spring”, started in Tunisia in December 2010. After the Tunisian president Ben Ali had fled the country Egypt’s population saw that such a rebellion could be successful. After an 18 day protest against long-time President Hosni Mubarak, Egypt’s president finally resigned and turned power over to the military. In February protests erupted in Libya. Rebels who were against Gaddafi and his regime gathered in Benghazi and created a new government . The Libyan dictator refused to step down and used the air force and army in an all-out civil war against the rebels. A UN resolution gave NATO the authorization to fly over Libya and make sure Gaddafi’s fighter planes do not attack rebels. After months of fighting the Libyan dictator was finally overthrown and killed.\n\nProtests in Arab nations have erupted for many reasons. Many countries have dictators who have been in power for decades. Corruption is widespread and basic human rights are often violated . In some countries the government has not shared the money from oil with the population, who continues to live in poverty . Many young people who have taken part in protests have studied in western countries and know what real democracy is.\n\nIn contrast to earlier protests the rebellions of 2010 and 2011 have been better organized because of social networks like Facebook or Twitter. The opposition planned their protests on these and used YouTube to send images and videos out to the rest of the world. The unrest caused by the protests in Arab countries has led to economic troubles as well. Oil and food prices have risen dramatically. Economic growth in the region is also expected to decline.","targets":[["air force","part of a country’s military that uses airplanes to fight"],["all-out","using a lot of energy"],["attack","use violence against"],["attempt","try"],["authorization","the right to do something"],["civil war","conflict between two groups of people in the same country"],["decade","a period of ten years"],["decline","to go down"],["economic","financial"],["erupt","come up, break out"],["flee-fled","escape to another place"],["gather","come together"],["government","the people who rule a country"],["growth","to expand, become bigger"],["human rights","the basic rights that everyone should have, like the right to vote or to say what you want"],["in contrast to","compared to"],["long-time","for many years"],["military","army"],["overthrow","bring down, defeat, win against"],["population","the people who live in a country"],["poverty","the state of being poor"],["refuse","do not want to"],["resign","step down, give up power"],["resolution","decision, declaration"],["rise","go up"],["social network","group of people who have the same interests and communicate on internet platforms"],["successful","do well, work"],["transfer","give to someone else"],["unrest","conflict, fighting"],["uprising","revolt, rebellion"],["violate","to do something that is against an agreement; to disobey"],["wave","series"],["widespread","common, general"]],"qs":[{"t":"tf","q":"“resign” means: step down, give up power","a":true},{"t":"tf","q":"“population” means: common, general","a":false},{"t":"tf","q":"“violate” means: to do something that is against an agreement; to disobey","a":true},{"t":"tf","q":"“government” means: the right to do something","a":false},{"t":"tf","q":"“gather” means: come together","a":true},{"t":"mcq","q":"Which word means: “bring down, defeat, win against”?","o":["attack","overthrow","resign"],"a":1},{"t":"mcq","q":"Which word means: “common, general”?","o":["uprising","widespread","decade"],"a":1},{"t":"mcq","q":"Which word means: “use violence against”?","o":["widespread","government","attack"],"a":2},{"t":"mcq","q":"Which word means: “the right to do something”?","o":["refuse","transfer","authorization"],"a":2},{"t":"mcq","q":"Which word means: “the state of being poor”?","o":["gather","poverty","refuse"],"a":1},{"t":"gap","q":"A ___ of demonstrations and protests has been going on in many Arab countries of the Middle East and Northern Africa since the end of 2010.","a":"wave"},{"t":"gap","q":"Many countries have dictators who have been in power for ___.","a":"decades"},{"t":"gap","q":"In many other Arab countries, like Bahrain and Syria there have been ___ against the government.","a":"uprisings"},{"t":"gap","q":"Rebels who were against Gaddafi and his regime ___ in Benghazi and created a new government .","a":"gathered"},{"t":"gap","q":"A UN ___ gave NATO the authorization to fly over Libya and make sure Gaddafi’s fighter planes do not attack rebels.","a":"resolution"}]},{"id":"a10","day":10,"title":"Osama Bin Laden","text":"Osama bin Laden was the founder of the terrorist organization al Qaeda. He was made responsible for the terrorist attacks on the World Trade Centre in 2001 and for bomb attacks in many places around the world. Bin Laden was once a citizen of Saudi Arabia but criticized the Arab country for being America’s ally. Bin Laden was America’s most wanted person and has been a major target of the USA’s war on terror.\n\nOn May 1, 2011 President Obama declared that United States forces had killed bin Laden in a villa in Pakistan.\n\nChildhood and education Osama bin Laden came from a wealthy Saudi Arabian family. His father was a well- respected businessman. After school he studied economics and business administration at the university but it is not clear whether he earned an academic degree or not. Bin Laden married his first wife at the age of 17. Together with his other three wives he is said to have up to 25 children.\n\nBeliefs and ideology From his youth on Osama bin Laden was always interested in religion. He was against all western systems and ideologies and said that living by the Sharia law was the only form of Islam. He sympathised with the Taliban regime in Afghanistan because they had a very conservative and radical view of Islam.\n\nBin Laden not only threatened America because they had gotten involved in the Islamic world but also was truly anti-Semitic. On many occasions he stressed the need to eliminate Israel and give Palestine back to the Arabs.\n\nMujahedeen in Afghanistan During the Soviet invasion and occupation of Afghanistan in the 1980s bin Laden joined the Mujahedeen. During this period the United States supported the freedom fighters and gave them financial aid to help defeat the Soviets. Bin Laden helped with the money he had inherited from his Saudi family.\n\nFormation of Al Qaeda Although nobody knows exactly when al Qaeda came to life it is thought that the group was founded as an Islamic faction in 1988. He recruited mostly Mujahedeen fighters as members of the group.\n\nIn the 1990s bin Laden criticised his home country Saudi Arabia for letting American soldiers on Islamic soil. The Saudis had agreed to accept American help in order to fight against Saddam Hussein. For bin Laden, being dependent on the western world was unacceptable.\n\nAfter being expelled from Saudi Arabia he lived in exile in Sudan for a few years and during the mid 1990s went back to Afghanistan. With the help of the new Taliban regime bin Laden raised money and created new training camps for Mujahedeen fighters.\n\nAl Qaeda bombings Terrorist activities by Al Qaeda started in the 1990s. Bin Laden funded most of them including attacks in Luxor, Egypt killing 60 people and the bombing of the American embassy in Nairobi killing over two hundred.\n\nTowards the end of the millennium it was clear that al Qaeda was the major terrorist threat in the world. Bin Laden officially declared America the enemy of the Jihad and called for all Muslims to join in a holy war against the west.\n\nAfter 9/11 After the terrorist attacks on America in September 2001 it took the FBI and the CIA only weeks to find out that bin Laden was responsible. In October 2001 the United States launched attacks on Afghanistan and al Qaeda training camps. Although they deposed of the Taliban regime they failed in capturing bin Laden, who was probably hiding in a cave complex in the Afghan mountains.\n\nWhen Barack Obama became president in 2008 he announced that the United States would be sending more troops to Afghanistan in an attempt to destroy al Qaeda strongholds. He also made it clear that the United States was putting effort into finding bin Laden, who was still at large. He was also seeking help from the Pakistani government because bin Laden might be hiding neighbouring Pakistan.\n\nDeath of bin Laden On May 1, 2011 a team of American Special Forces attacked a mansion near Pakistan’s military academy about a hundred kilometres north of Islamabad. Bin Laden and three other people, including one of his sons, were killed. The Americans took possession of his body and dumped it into the Arabian Sea. After the announcement of bin Laden’s death hundreds of thousands of people all over the world celebrated.","targets":[["accept","take on"],["activity","action"],["agree","to say yes"],["aid","help, support"],["ally","friend"],["although","while"],["announce","to say officially"],["announcement","official message for the people"],["anti-Semitic","someone who hates Jewish people"],["at large","to be free"],["attack","to use weapons against an enemy"],["attempt","try"],["business administration","how to organize and lead companies"],["capture","to take a person prisoner"],["cave","a natural hole in a mountain"],["celebrate","to be happy and have a party"],["citizen","a person who lives in a country and has rights there"],["declare","to say officially, speak out"],["defeat","to win against in a war"],["degree","a qualification that you get when you have finished college or the university"],["dependent on","to need something very much"],["depose","to get rid of"],["dump","throw"],["earn","get"],["economics","the study of the way in which money and goods are produced"],["effort","attempt, try"],["eliminate","destroy"],["embassy","a group of people who work for the government of their country in another country, or the building they work in"],["exile","a situation in which you must leave your country and live somewhere else"],["expel","to send away"],["faction","group, party"],["founder","person who starts something new"],["fund","to pay for something"],["inherit","to get money from your family after they have died"],["invasion","to march into a country with soldiers and take control"],["involve","engage , be a part of"],["it is thought","people think that"],["Jihad","holy war fought by Muslims"],["launch","start"],["mansion","very large house"],["military academy","a college or school where young men are trained to become officers"],["millennium","a thousand years"],["Mujahedeen","Muslim soldiers with strong religious beliefs"],["occasion","event, time"],["occupation","to keep control of a country by force"],["officially","to say something so that many people can hear it"],["possession","ownership, control"],["raise","collect"],["recruit","to get people to become a member"],["regime","a government that is not elected and very often does not have the support of the people"],["responsible","in control of, to give orders to"],["seek","look for, want"],["Sharia law","system of religious rules followed by Muslims"],["soil","ground, place"],["Special Forces","soldiers who have been trained to fight against terrorists"],["stress","to point out a statement or idea"],["stronghold","a place where a group defends itself"],["support","help"],["sympathise","understand, support, like"],["threat","danger"],["threaten","warn , terrorize"],["towards","near"],["unacceptable","it is wrong"],["view","attitude, feeling"],["well-respected","admired and liked by many people because of the good things you have done"]],"qs":[{"t":"tf","q":"“view” means: attitude, feeling","a":true},{"t":"tf","q":"“effort” means: a government that is not elected and very often does not have the support of the people","a":false},{"t":"tf","q":"“celebrate” means: to be happy and have a party","a":true},{"t":"tf","q":"“agree” means: in control of, to give orders to","a":false},{"t":"tf","q":"“attack” means: to use weapons against an enemy","a":true},{"t":"mcq","q":"Which word means: “a situation in which you must leave your country and live somewhere else”?","o":["sympathise","recruit","exile"],"a":2},{"t":"mcq","q":"Which word means: “a government that is not elected and very often does not have the support of the people”?","o":["regime","unacceptable","occasion"],"a":0},{"t":"mcq","q":"Which word means: “to take a person prisoner”?","o":["capture","founder","celebrate"],"a":0},{"t":"mcq","q":"Which word means: “in control of, to give orders to”?","o":["responsible","recruit","cave"],"a":0},{"t":"mcq","q":"Which word means: “a natural hole in a mountain”?","o":["cave","unacceptable","fund"],"a":0},{"t":"gap","q":"Osama bin Laden was the ___ of the terrorist organization al Qaeda.","a":"founder"},{"t":"gap","q":"On May 1, 2011 President Obama ___ that United States forces had killed bin Laden in a villa in Pakistan.","a":"declared"},{"t":"gap","q":"Bin Laden helped with the money he had ___ from his Saudi family.","a":"inherited"},{"t":"gap","q":"In the 1990s bin Laden criticised his home country Saudi Arabia for letting American soldiers on Islamic ___.","a":"soil"},{"t":"gap","q":"After being expelled from Saudi Arabia he lived in ___ in Sudan for a few years and during the mid 1990s went back to Afghanistan.","a":"exile"}]},{"id":"a11","day":11,"title":"Amazon.com","text":"Amazon.com is the world's largest Internet company. It started out as an online bookstore in the middle of the 1990s and grew gradually over the years. Today Amazon sells almost everything from CDs and DVDs to sportswear and electrical appliances. The company also produces its own tablets and e-readers and lets users upload their own photos and other files to the Amazon-based cloud.\n\nAmazon offers its services all over the world. It operates its own websites in the UK, Germany, China, Australia, as well as many South American and Asian countries.\n\nAmazon.com was founded by Jeff Bezos in 1994. It first operated out of a small garage in Washington state. Within a year Amazon offered hundreds of thousands of books. People could not only order books from an online catalogue but also write their own reviews. In 1997 Amazon.com started trading shares on the NASDAQ stock exchange. By 2000 it made over a billion dollars in sales.\n\nAs time went on Amazon.com grew gradually. It bought many of its rivals and today cooperates with other companies and lets them sell their products via the Amazon website.\n\nIn 2007 Amazon went a step further. It surprised the electronics world with a revolutionary eBook reader, the Kindle, which today dominates the market. In 2011 a tablet computer followed, the Amazon Fire. In the following years the company started selling music downloads and videos on demand. Amazon customers can store everything they buy on their private cloud and download it anytime they want.\n\nToday, Amazon.com serves 20 million customers every day. Its annual income is over 34 billion dollars.\n\nThere are a number of reasons for Amazon’s success. One of them is company founder Jeff Bezos himself. TIME magazine’s “Man of the Year” of 1999 is a visionary, an ambitious businessman who is not afraid of taking risks, even if it means a downturn for the company at first. Amazon’s website tries to personalize the buying experience for its customers. It knows what you want and what you are interested in.\n\nAlthough Amazon.com is the biggest internet retailer in the world it is often criticized. Economic experts say that Amazon is turning Internet business into a monopoly.\n\nOthers point out the bad working conditions for Amazon employees.\n\nAmazon is a business empire that sells almost anything cheaper and faster than anyone else.","targets":[["although","while"],["Amazon-based","something that only works with Amazon and its own computers"],["ambitious","hard-working, very motivated"],["annual","yearly"],["appliance","machine that you use for doing something at home"],["billion","a thousand million"],["cloud","when you work on your own computer but use software or store files on other computers on the Internet"],["condition","situation"],["cooperate","work together with"],["customer","a person who buys a product"],["dominate","control, lead"],["downturn","sales go down"],["empire","very large company or group of companies"],["employee","worker"],["experience","event, something that happens"],["found – founded","start something new"],["gradually","slowly"],["income","the money you get from selling products"],["monopoly","a large company that controls all or most of the business"],["operate","work"],["personalize","to organize something so that it fits the habits of a certain person"],["point out","want to show"],["retailer","person that sells products to customers"],["review","an opinion about a book, movie etc…"],["revolutionary","something new or not done before"],["rival","other company that wants to sell the same products"],["sales","selling products"],["serve","sell products to"],["services","what a company offers its customers"],["share","part of a company"],["sportswear","clothes you need for doing sports"],["stock exchange","a place where you can buy and sell parts of a company"],["store","save something in order to use it later"],["tablet","small computer with a touch screen, but without a keyboard and mouse"],["video on demand","you can download a video to watch on your computer or TV whenever you want to"],["visionary","someone who has clear ideas and strong feelings about the future"]],"qs":[{"t":"tf","q":"“sales” means: selling products","a":true},{"t":"tf","q":"“serve” means: part of a company","a":false},{"t":"tf","q":"“empire” means: very large company or group of companies","a":true},{"t":"tf","q":"“retailer” means: other company that wants to sell the same products","a":false},{"t":"tf","q":"“tablet” means: small computer with a touch screen, but without a keyboard and mouse","a":true},{"t":"mcq","q":"Which word means: “the money you get from selling products”?","o":["services","income","visionary"],"a":1},{"t":"mcq","q":"Which word means: “part of a company”?","o":["revolutionary","share","income"],"a":1},{"t":"mcq","q":"Which word means: “a large company that controls all or most of the business”?","o":["monopoly","billion","visionary"],"a":0},{"t":"mcq","q":"Which word means: “other company that wants to sell the same products”?","o":["services","rival","serve"],"a":1},{"t":"mcq","q":"Which word means: “hard-working, very motivated”?","o":["ambitious","tablet","appliance"],"a":0},{"t":"gap","q":"It started out as an online bookstore in the middle of the 1990s and grew ___ over the years.","a":"gradually"},{"t":"gap","q":"It ___ its own websites in the UK, Germany, China, Australia, as well as many South Am
