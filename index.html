 was this mysterious \"third man\" ?\n\nWhen they got back to Anna's flat, Calloway was there and arrested Anna because her papers were forged. Holly told Calloway what he had learned about Harry's death but Calloway told him to \"leave death to the professionals\" and go home. However, Harry decided to find out the truth. He talked to Dr Winkel and Popescu, Harry's Romanian friend. Popescu denied that there had been a \"third man\" involved in the accident.\n\nWhen Holly went back to the scene of the accident, the porter said, \"I'd like to tell you something ... come to my place tonight\". But when he and Anna went to see the porter that night, they found that he had been murdered. The porter’s son accused Holly of being the murderer. Anna and Holly had to escape and after hiding in a cinema Holly finally got back to his hotel to find a taxi driver waiting to take him to his evening lecture.\n\nHolly's lecture was so terrible that most people left before it was over, but Popescu stayed there. He asked Holly questions about his new novel. Holly said that it was a murder story; it was based on fact and called \"The Third Man\". After escaping from Popescu and two other men Holly went to police headquarters. Calloway told Holly in detail about Harry's crimes. He had sold diluted penicillin that had caused the deaths of thousands of innocent victims, especially children. Holly was finally convinced and decided to leave Vienna.\n\nHe went to say goodbye to Anna and suddenly saw a man standing in a door on the other side of the street. It was Harry Lime! He called out his name but Harry mysteriously disappeared. Holly rang Calloway and they found out that Harry had escaped underground into Vienna's sewers. Holly spoke to Kurtz and Winkel and told them to organize a meeting with Harry. The two friends met at last on the big wheel in the Prater amusement park. Harry showed no regrets for the crimes he had committed and even threatened to kill his old friend Holly. After that, Holly agreed to help Calloway catch Harry.\n\nThey decided to use Holly to set up a trap. She was supposed to meet Harry in a cafe which Calloway and his men had surrounded. Anna came in and tried to warn Harry but it was too late. Harry pulled out his gun to kill Holly but the police came in. Harry escaped and disappeared underground. Calloway , his men and Holly followed him into the sewage system of Vienna. Suddenly there were shots. Cornered like a rat and badly wounded Harry tried to go up a ladder and out of the sewer. Holly saw his friend and went after him. When Harry pulled the gun on his friend Holly shot him.\n\nBefore he left Vienna, Holly went to his friend's second funeral. There were even fewer people than at the first one. Afterwards, Holly tried to talk to Anna but she ignored him and walked away.","targets":[["accept","to say yes"],["accuse","to blame someone for doing something"],["amusement park","large park with roller coasters, rides , merry-go-rounds and other attractions"],["arrest","to take to a police station because the police think that a person has done something against the law"],["cemetery","piece of land on which dead people are buried"],["certify","to say that something is true"],["convinced","sure, certain"],["corner","to force a person into a situation from which they cannot escape"],["dilute","to make thinner"],["disappear","go away, not to be seen again"],["escape","to get away from"],["especially","above all"],["flat","apartment"],["forge","to illegally copy something"],["funeral","to bury someone who has died"],["illegal","against the law"],["immediately","at once"],["innocent","to get hurt even though you are not involved in something"],["involve","take part in"],["lecture","speech"],["mistake","to wrongly think that you are a certain person, but you are not"],["occupy","to be controlled by"],["penicillin","type of medicine that is used to treat infections"],["police headquarters","the main office of the police"],["porter","someone whose job it is to look after a building"],["regret","to be sorry"],["ruins","to be completely destroyed"],["sewage system , sewer","passage under the ground that carries away waste material and water from houses or factories"],["square","larger area in a city"],["sudden","without warning"],["surround","to be all around"],["trap","clever trick to catch someone"],["victim","person who gets hurt or is killed"],["wounded","hurt"]],"qs":[{"t":"tf","q":"“funeral” means: to bury someone who has died","a":true},{"t":"tf","q":"“occupy” means: to wrongly think that you are a certain person, but you are not","a":false},{"t":"tf","q":"“accept” means: to say yes","a":true},{"t":"tf","q":"“escape” means: type of medicine that is used to treat infections","a":false},{"t":"tf","q":"“convinced” means: sure, certain","a":true},{"t":"mcq","q":"Which word means: “to be completely destroyed”?","o":["forge","ruins","penicillin"],"a":1},{"t":"mcq","q":"Which word means: “to wrongly think that you are a certain person, but you are not”?","o":["mistake","corner","escape"],"a":0},{"t":"mcq","q":"Which word means: “without warning”?","o":["corner","porter","sudden"],"a":2},{"t":"mcq","q":"Which word means: “type of medicine that is used to treat infections”?","o":["penicillin","involve","surround"],"a":0},{"t":"mcq","q":"Which word means: “to be sorry”?","o":["corner","convinced","regret"],"a":2},{"t":"gap","q":"When Holly went to Harry's ___ he found out that his friend had been hit and killed by a truck as he was crossing the street.","a":"flat"},{"t":"gap","q":"Kurtz described how he and another man, Popescu, had carried Harry's body to a ___ after the accident.","a":"square"},{"t":"gap","q":"Harry's doctor, Dr Winkel, had been passing by and had ___ his death.","a":"certified"},{"t":"gap","q":"When Holly went back to the scene of the accident, the ___ said, \"I'd like to tell you something ... come to my place tonight\".","a":"porter"},{"t":"gap","q":"Holly was finally ___ and decided to leave Vienna.","a":"convinced"}]},{"id":"a22","day":22,"title":"Amusement Parks","text":"An amusement park is an outdoor area with games, rides and shows. They are spread over a large area, often many square kilometers. Young and old visitors can enjoy many types of attractions. They can ride on roller coasters, go high up in the air in a Ferris wheel or ride on carousels. Amusement parks also offer restaurants and bars to eat and drink, as well as green areas with grass to sit down or relax.\n\nMost amusement parks have a fixed location. Some of them are open all year round, others only during the warmer season. Today amusement parks have been replaced by theme parks. These places focus on a certain topic of history or natural life. The first theme park, Disneyland, opened in California in 1955.\n\nHistory In the Middle Ages minstrels wandered around and sang in open areas. Entertainers gathered in a town field or a market square. After a few days they went to another town. They often performed in tents and offered food and entertainment. In addition, visitors could see circus artists perform or have their portrait painted by street painters.\n\nThe first real amusement parks emerged out of fairs and public gardens in Europe in the 16th century. Later on amusement parks in fixed locations developed in larger cities. The Prater in Vienna was the basis for many amusement parks in other locations. The first amusement park in the United States was located on Coney Island, in New York City. For a long time it was the world's biggest attraction, with bars, souvenir shops, rides along a long beach. After its peak in the 1920s, the amusement area’s popularity declined.\n\nAfter World War II larger-scale amusement parks started developing in Europe and other continents. Up to the end of the twentieth century European parks are small compared to their American counterparts. The first large amusement park outside the USA was Euro Disneyland, which opened in Paris in 1990. In Japan an Asian version of Disneyland opened in 1993.In Denmark, Legoland features miniature buildings and attractions built out of the world-famous Lego plastic bricks.\n\nRides and Attractions Rides are the greatest attractions of amusement parks. By the 19th century many entertainment parks had carousels or merry-go-rounds. They began to become popular during medieval tournaments where knights fought against each other. Later on roller coasters were added to the attractions of amusement parks. They featured steep drops from high altitudes. Roller coasters originated from Russian ice slides that were built for the people as early as the 17th century.\n\nToday almost every amusement park has a Ferris wheel. The first original Ferris wheel in the United States was built for the Chicago Exhibition in 1893. It allowed visitors to rise to about 80 meters. Today Ferris wheels are not only located in amusement parks but in other places as well. London Eye, for example, is situated on the Thames River and gives visitors a breathtaking view of London.\n\nOther attractions of amusement parks include twisters and spin-based machines that give visitors a thrilling experience. More and more amusement parks are designing new machines that give their visitors a new feeling. What would an amusement park be without various water rides, especially in the summer when it’s hot? Haunted houses show visitors a variety of mirrors which make them thinner or fatter and cause optical illusions.\n\nMany amusements parks offer their visitors special trains that take them from one attraction to another. Special safety features are built into all of these attractions so that they cannot cause any damage, although accidents sometimes do happen. With the advent of electricity amusement parks opened at night and allowed people working during the daytime to go there too.","targets":[["advent","coming, beginning"],["although","while"],["altitude","height"],["area","place"],["attraction","an interesting object to see or enjoy"],["basis","starting point"],["breathtaking","wonderful"],["brick","a small block used as a toy"],["carousel","machine with wooden horses on it that turns around and around, which people can ride in for fun"],["cause","lead to"],["century","a period of a hundred years"],["certain","special"],["counterpart","the same thing but only in a different place"],["decline","to go down"],["design","plan, make"],["develop","grow"],["drop","to go down to a lower place"],["electricity","the power that is carried by cables and wires and give you light"],["emerge","come from"],["entertainer","a person who sings, tells jokes or dances in front of people"],["especially","above all"],["exhibition","fair, show"],["experience","something that happens"],["fair","large area with rides and other attractions"],["feature","offer, present to the visitor"],["Ferris wheel","a large wheel that has cabins which people can ride in"],["fixed","not moving"],["focus","center"],["gather","get together"],["haunted","scary, ghostly"],["in addition","also"],["include","consist of"],["knight","a man who was trained to fight riding a horse"],["larger-scale","bigger"],["location","place"],["market square","place in the middle of a town where products were traded"],["medieval","in the Middle Ages"],["merry-go-round","carousel"],["miniature","very small"],["minstrel","a singer or musician in the Middle Ages"],["optical illusion","a picture or image that tricks your eyes and makes you see something that is not there"],["originate","come from; start out from"],["peak","when something is at its best"],["perform","act in front of people"],["popularity","when something is liked by many people"],["portrait","drawing or painting of a person"],["public","for everybody to visit"],["replace","to build something else instead"],["roller coaster","a track with steep slopes an curves; people ride in small cars at a very fast speed"],["safety feature","something built in that protects you from danger"],["situated","located"],["slide","you can move down a flat surface"],["spin-based","here to go round and round quickly"],["spread","stretch, reach from one place to another"],["steep","sharp"],["tent","an object you can sleep in when you go camping; it is made up of cloth and poles"],["thrilling","exciting"],["tournament","fighting between soldiers and knights in the Middle Ages"],["variety","selection"],["various","different kinds of"]],"qs":[{"t":"tf","q":"“miniature” means: very small","a":true},{"t":"tf","q":"“drop” means: stretch, reach from one place to another","a":false},{"t":"tf","q":"“attraction” means: an interesting object to see or enjoy","a":true},{"t":"tf","q":"“feature” means: the power that is carried by cables and wires and give you light","a":false},{"t":"tf","q":"“brick” means: a small block used as a toy","a":true},{"t":"mcq","q":"Which word means: “a person who sings, tells jokes or dances in front of people”?","o":["gather","entertainer","fixed"],"a":1},{"t":"mcq","q":"Which word means: “stretch, reach from one place to another”?","o":["various","spread","century"],"a":1},{"t":"mcq","q":"Which word means: “when something is at its best”?","o":["attraction","peak","include"],"a":1},{"t":"mcq","q":"Which word means: “the power that is carried by cables and wires and give you light”?","o":["electricity","attraction","haunted"],"a":0},{"t":"mcq","q":"Which word means: “in the Middle Ages”?","o":["gather","medieval","various"],"a":1},{"t":"gap","q":"An amusement park is an outdoor ___ with games, rides and shows.","a":"area"},{"t":"gap","q":"Young and old visitors can enjoy many types of ___.","a":"attractions"},{"t":"gap","q":"Amusement parks also offer restaurants and bars to eat and drink, as well as green ___ with grass to sit down or relax.","a":"areas"},{"t":"gap","q":"Today amusement parks have been ___ by theme parks.","a":"replaced"},{"t":"gap","q":"For a long time it was the world's biggest ___, with bars, souvenir shops, rides along a long beach.","a":"attraction"}]},{"id":"a23","day":23,"title":"The Simpsons","text":"The Simpsons is an American sitcom that shows middle class lifestyle in cartoon form. The half-hour episodes take place in and around the fictional town of Springfield and make fun out of American culture and society.\n\nSince the show started in 1989 the Simpsons have been broadcast over 500 times. This makes it the longest running sitcom in American television history. In 2007 a full- length movie, The Simpsons Movie, made over half a billion dollars.\n\nThe Simpsons has won many prizes, concluding the Emmy Awards. In the year 2000 Time magazine named it the best television series of the century and the cartoon characters of The Simpsons received their own star on Hollywood’s Walk of Fame.\n\nThe Simpson family consists of 5 main characters. Homer is the rather clumsy, beer- drinking father. He works at a nuclear power plant in Springfield and is married to Marge Simpson, a typical American middle class housewife. The couple has three children. Bart is a ten-year old who constantly gets into trouble. Lisa is a highly intelligent eight-year old who has become a vegetarian and a Buddhist. Maggie, the family’s baby, is often shown with a pacifier. The Simpsons have two pets, a dog named Santa’s Little Helper and Snowball, a cat.\n\nEven though the series focuses around animated characters, many human celebrities have starred on The Simpsons in the past, for example, Bill Clinton, Tony Blair, Tom Jones or Mel Gibson.\n\nThe comedy centers on a few major themes. Homer’s work in a nuclear power plant opens up the topic of our environment for discussion. Bart and Lisa are often shown in their school life where educational problems arise. Homer and Marge try to raise their children as best as they can but, as in many typical families, do not always succeed. The series also makes political comments and criticizes how the government and large corporations exploit the normal worker.\n\nThe program has been very successful around the world. It is watched by millions of people in over a hundred countries. The Simpsons have triggered a merchandising industry revolving around T-shirts, DVDs, video games, a theme park and books.","targets":[["animated","made to look as if they are moving"],["billion","a thousand million"],["broadcast","to send out a radio or television program"],["cartoon","film with drawings of characters"],["celebrity","a famous person"],["century","a hundred years"],["clumsy","to do something in a very funny way"],["consist","made up of"],["constantly","always"],["corporation","a very big company"],["criticize","not approve of"],["Emmy Awards","prize awarded for the best television shows"],["environment","the world around us"],["episode","one of a series of programs that is continued every day or every week"],["even though","while"],["exploit","to treat someone in an unfair way, or to do something that will give you profits"],["fictional","not real; it does not exist"],["focus","center"],["full-length","the normal length of a movie"],["government","the people who rule a country"],["main","important"],["merchandising","products that are about the topic"],["nuclear power plant","building that uses produces electricity by splitting atoms"],["pacifier","a small rubber that a baby puts into its mouth and sucks"],["raise","educate; to help them grow up"],["receive","get"],["revolve","to center on"],["sitcom","situation comedy; a funny television program with the same characters every week"],["star","to be a part of a film"],["succeed","to do something and get the best results"],["successful","popular"],["theme park","large park that focuses on a certain topic; people go there, enjoy themselves and have fun"],["trigger","set off, start"]],"qs":[{"t":"tf","q":"“raise” means: educate; to help them grow up","a":true},{"t":"tf","q":"“consist” means: to be a part of a film","a":false},{"t":"tf","q":"“trigger” means: set off, start","a":true},{"t":"tf","q":"“corporation” means: not real; it does not exist","a":false},{"t":"tf","q":"“exploit” means: to treat someone in an unfair way, or to do something that will give you profits","a":true},{"t":"mcq","q":"Which word means: “to do something in a very funny way”?","o":["episode","trigger","clumsy"],"a":2},{"t":"mcq","q":"Which word means: “to be a part of a film”?","o":["episode","clumsy","star"],"a":2},{"t":"mcq","q":"Which word means: “products that are about the topic”?","o":["trigger","merchandising","clumsy"],"a":1},{"t":"mcq","q":"Which word means: “not real; it does not exist”?","o":["cartoon","broadcast","fictional"],"a":2},{"t":"mcq","q":"Which word means: “to do something and get the best results”?","o":["corporation","pacifier","succeed"],"a":2},{"t":"gap","q":"Since the show started in 1989 the Simpsons have been ___ over 500 times.","a":"broadcast"},{"t":"gap","q":"This makes it the longest running ___ in American television history.","a":"sitcom"},{"t":"gap","q":"Homer is the rather ___, beer- drinking father.","a":"clumsy"},{"t":"gap","q":"Bart is a ten-year old who ___ gets into trouble.","a":"constantly"},{"t":"gap","q":"Maggie, the family’s baby, is often shown with a ___.","a":"pacifier"}]},{"id":"a24","day":24,"title":"The Nintendo Wii","text":"The Wii is a video game created by Nintendo that uses a wireless controller to show the movements of your body, hands and legs on a television screen. It was first presented to the public in November 2006 Wii controllers have many forms and shapes. For example, they can simulate the movement of a tennis racket, a golf club or other things.\n\nA fitness pad allows you to do exercises that a fitness trainer on the television screen shows you.\n\nThe Wii turns a video game into a physical activity that is fun too. It is also used by doctors and therapists who show patients how to balance themselves or build up muscles after an operation or illness.\n\nBut how does the Wii really work? There are chips, sensors and accelometres in the Wii remote that can record shifts and angles in your body movements. You can move it in all directions. When the body moves these changes are sent via Bluetooth to a console. You can shoot at something by pressing a button, move an object on the screen and do many other things with the remote.\n\nThere are many advantages of Nintendo’s Wii. It is easy to use and the controller is fast and accurate. Objects move on the screen exactly the way you would expect them to. In 2006 Nintendo released a new game console called Wii Fit containing more than forty different kinds of physical exercises. It has a wireless balance board that you can stand, sit or lie on. It can calculate your body mass index and be your personal fitness trainer. The balance board can also be used for other sports that require a sense of balance, like snowboarding or windsurfing.\n\nWith the Wii you cannot only compete with other players in your own living room. You can connect the console to the Internet and play with people around the world.\n\nIn the meantime you can buy many other accessories that work with the Wii. A steering wheel that gives you the feeling of driving a real car, boxing gloves allow you to stand in the middle of a ring. With a special ball you can even simulate bowling.","targets":[["accelometre","something that records how fast you move a part of your body"],["accessory","pieces that you can use with the game"],["accurate","exact"],["activity","action, something that you do with your body"],["advantage","the good side of"],["angle","the space between two lines that are not parallel; measured in degrees"],["balance","to be in a position that you do not fall to one side; to be steady"],["balance board","board that you keep straight by moving it all the time"],["Bluetooth","wireless technology"],["body mass index","a number based on a person’s weight and height"],["bowling","indoor game in which you roll a heavy ball down a track and knock down a group of pins"],["calculate","find out something with the use of numbers"],["connect","link"],["contain","to be made up of"],["controller","an object that is connected to a game console and used to play video games"],["create","make"],["exercise","physical activity"],["glove","soft piece of leather that you wear on your hands"],["movement","changing of position"],["pad","flat object mostly made of rubber or plastic"],["patient","an ill person"],["physical","relating to your body"],["public","all people"],["record","save data"],["release","to make public so that you can buy it in shops"],["remote","an object that you use for controlling a machine without touching it"],["require","need"],["sense of balance","feeling that you can always keep your body on an object without falling down"],["sensor","a small plate that records movements"],["shape","form"],["shift","change, movement"],["simulate","to have the feeling that something is real"],["steering wheel","round object in a car that lets you move in different directions"],["therapist","someone who has been trained to help you after you have been ill"],["wireless","a system of connecting computers and other machines by radio signals"]],"qs":[{"t":"tf","q":"“balance” means: to be in a position that you do not fall to one side; to be steady","a":true},{"t":"tf","q":"“therapist” means: physical activity","a":false},{"t":"tf","q":"“pad” means: flat object mostly made of rubber or plastic","a":true},{"t":"tf","q":"“calculate” means: indoor game in which you roll a heavy ball down a track and knock down a group of pins","a":false},{"t":"tf","q":"“advantage” means: the good side of","a":true},{"t":"mcq","q":"Which word means: “relating to your body”?","o":["physical","patient","public"],"a":0},{"t":"mcq","q":"Which word means: “physical activity”?","o":["shift","exercise","movement"],"a":1},{"t":"mcq","q":"Which word means: “wireless technology”?","o":["bluetooth","public","angle"],"a":0},{"t":"mcq","q":"Which word means: “indoor game in which you roll a heavy ball down a track and knock down a group of pins”?","o":["pad","bowling","bluetooth"],"a":1},{"t":"mcq","q":"Which word means: “something that records how fast you move a part of your body”?","o":["exercise","accelometre","release"],"a":1},{"t":"gap","q":"When the body moves these changes are sent via ___ to a console.","a":"bluetooth"},{"t":"gap","q":"In the meantime you can buy many other ___ that work with the Wii.","a":"accessories"},{"t":"gap","q":"For example, they can ___ the movement of a tennis racket, a golf club or other things.","a":"simulate"},{"t":"gap","q":"There are chips, ___ and accelometres in the Wii remote that can record shifts and angles in your body movements.","a":"sensors"},{"t":"gap","q":"It has a ___ balance board that you can stand, sit or lie on.","a":"wireless"}]},{"id":"a25","day":25,"title":"Motion Pictures","text":"Motion pictures – also called movies or films – belong to the most popular forms of entertainment today. Millions of people all over the world go to cinemas to enjoy an entertaining story and to see their favorite movie stars. The film industry is also a big business. Movies cost a lot of money and the people who make them hope to make a lot of profit and achieve worldwide fame.\n\nEquipment A movie camera operates like a normal camera but it takes 24 pictures a second. The lens focuses on a certain spot. Then a shutter opens and closes and an image is recorded on film.\n\nThe film itself is a roll of long thin flexible plastic that has layers of light- sensitive chemicals. Most films are 35 mm wide, which is the common size for motion pictures. A film has holes on both sides which the camera uses to move the roll forward. A projector shows a finished film on a screen. It moves the film forward at 24 frames per second so that our eyes register moving images and not still ones. A light bulb at the back of the projector projects the image onto the screen, an area of white plastic that is covered with tiny glass beads that make it bright.\n\nFilm sound is recorded by a machine and mixed together with the film so that when actors open and close their mouths the words are heard at the right time.\n\nPeople who make movies A film made for entertainment involves many people, sometimes hundreds of them.\n\nThe producer is the overall manager of a film. He must decide if a movie is made or not, raise money and hire the whole team of workers and actors. He also has to make plans to show and distribute the finished film in cinemas around the world.\n\nBefore a film is made, a story or idea has to exist. A screenwriter writes the screenplay - the story, the words that the actors speak and instructions on how the action takes place. Sometimes it is based on a book, a play, a real event, or an old movie; sometimes on the original ideas of the screenwriter.\n\nIf a producer wants to make a successful movie he has to hire a good director. A famous director can get good actors and actresses to work with him. He is the most important person on the set and in charge of everything. He tells the actors what to do and decides how the scenes are filmed.\n\nThere are many other people a director must work with. The director of photography is a person who knows everything about cameras, lenses and lighting and uses them to create the mood and atmosphere of scenes. Costume designers choose clothes and decide what the actors wear.\n\nA successful movie often depends on how good the actors are . They are the only people the audience gets into contact with. They must not only learn the words that characters speak in the screenplay but must also understand how to move and speak in a natural way. Music is also an important element of most films. A composer writes music to create mood. Sound editors and producers put the right music into the correct place of the film. Filming the movie Some scenes are made on a sound stage of a movie studio with scenery that must look as real a possible. The production team builds the set exactly the way they want it to be shown in the film, but this costs a lot of extra money. Other scenes are made on location or in a place that looks like the one in the story, like in front of a skyscraper or at the beach or the top of a mountain.\n\nSpecial effects are often important parts of action movies. Explosions are done on the set or in special places; sometimes smaller models of objects are built and then enlarged in the film. Modern effects specialists often do their work on computers and then transfer the effects to the film.\n\nScenes are not always shot in the order that they appear in the film. The film editor looks closely at all the shots that are made in the film. A scene may have been filmed from many different angles and distances. When a character speaks the film editor must decide whether to take the total view or a close-up of his or her face. Film editing is so important that the director works closely together with the film editor.\n\nFinally the pieces of the original film are put together in the right order. They are copied to one single piece of film. Then sound and effects are added.\n\nWhen a film is completed and ready to be shown a company is hired to promote the film and bring it to the attention of the people. Ads are put in magazines and newspapers, commercials are run on TV. The company hopes that it can bring as many viewers as possible into the cinemas. When the film is not shown in cinemas any more it is recorded on a DVD together with extras like interviews, unfinished scenes etc. and sold in shops. The production and sales of DVDs often bring film companies a lot of extra money.\n\nHistory of motion pictures In the late 1800s many inventors in England, France and the United States worked on ways to make motion pictures. Thomas Edison , an American inventor, made the first motion picture viewer in 1893 .The films were very short and had to be watched through a peephole.\n\nEarly movies were black and white and had no sound. In the 1920s sound was added to movies, the first colour movies were produced in the late 1930s and early 1940s.\n\nMovie became a big business. Hollywood, California became the centre of the American film industry because people could produce films the whole year round in a place where the weather never got too cold.\n\nLater on the film industry in other countries developed. Great Britain, France and Italy became major film producing nations in Europe. In the past few decades India has become the biggest film producer in the world. Centre of the movie industry is Mumbai, which was originally called Bombay. The Indian film industry is often called Bollywood, a mixture of Bombay and Hollywood.\n\nThere are many festivals and awards for motion pictures. The largest festival is held in Cannes, France each year. Other important festivals take place in Berlin, Venice and London. The best known awards are the Academy Awards or Oscars. Each year the best films, actors, foreign films etc. receive the most famous statuette in the film industry.\n\nFamous Directors Steven Spielberg has made Hollywood’s most successful films and is regarded as one of the most successful directors. Most of his films are actions movies. His success started with Jaws (1975) , a movie about dangerous sharks attacking swimmers at a beach. Close Encounters of the Third Kind (1977) and E.T: The Extra-Terrestrial (1982) are science fiction films about alien life. Jurassic Park (1993) and its sequel, The Lost World (1997) are about dinosaurs that have come back to live on a small island.\n\nSpielberg has also created more serious works. Schindler’s List (1993) is a powerful drama about a man who helped Jews during the Holocaust . Spielberg won an Oscar as the best director for the film, which also received an Academy Award as the best picture. Saving Private Ryan (1998) is a realistic story of battle during World War II.\n\nClint Eastwood started his career as an actor and gained fame in Italian westerns . Later on he played a police detective in Dirty Harry (1971). In In the Line of Fire (1993) he plays an American secret serviceman who must protect the president. Although he started directing films in the 1970s his breakthrough as a director came in 2004 with Million Dollar Baby, a story of a poor young female boxer, who becomes paralysed in her last fight. The film won the Oscar as best picture. In 2006 Eastwood received the prize for the best director in Letters from Ivo Jima.\n\nPeter Jackson is a New Zealand film director who gained international fame for directing the Lord of the Rings trilogy , based on a fantasy novel by J.R.R. Tolkien. Critics praised the powerful storytelling and spectacular special effects. Jackson won the Academy Award as the best director for the last part The Return of the King, which won 11 Oscars including best picture.\n\nMartin Scorsese is an American motion picture director who taught filmmaking at New York University before becoming a director. Many of his films are very realistic and often show violence. Taxi Driver (1976) shows the world of a violent war veteran. Gangs of New York (2002) explores gang violence in New York during the 1860s. The Aviator (2004) tells the story of Howard Hughes, a famous American aircraft designer.\n\nScorsese received an Academy Award for best director in the Mafia film The Departed (2006) George Lucas wrote and directed the science fiction fantasy Star Wars (1977), one of the most popular films in movie history. The film became an international success because of special effects that were used in film for the first time. Lucas also produced two sequels to the trilogy and twenty years later produced three more Star Wars movies.\n\nThe most successful films in history Money Earned Film                                            Worldwide in US Dollars Titanic (1997)                                  1 800 000 000 The Lord of the Rings: 1 120 000 000 Return of the King (2003) Pirates of the Caribbean : 1 060 000 000 Dead Man’s Chest (2006) Harry Potter and the Sorcerer’s Stone (2001)    968 000 000 Pirates of the Caribbean : 954 000 000 At World’s End (2007) Star Wars Episode 1 : 922 000 000 The Phantom Menace (1999) The Lord of the Rings : 921 000 000 The Two Towers (2002) Jurassic Park (1993)                            919 000 000 Harry Potter and the Goblet of Fire (2005)      892 000 000 Spider Man 3 (2007)                             885 000 000","targets":[["Academy Award","also called „Oscar“ ; is a prize given each year in the USA for the best film, actor, director of the industry"],["achieve","to get something that you really want"],["ad","something that tells you about a product and shows how good it is"],["add","put in"],["aircraft designer","person who plans and makes airplanes"],["alien","living things from another world"],["although","while"],["angle","position from which you look at something"],["appear","happen, are shown"],["attention","the interest that you show"],["audience","the people who go to a cinema and watch a film"],["award","a prize that someone gets for doing something special"],["based on","to use something from which something else is developed"],["battle","a fight between armies in a war"],["bead","one of a set of small round pieces of glass, wood or plastic that you where around your neck or arm"],["breakthrough","a film that made him successful for the first time"],["bright","full of light"],["business","industry"],["certain","special"],["choose","select, pick"],["close-up","picture that is taken very close to someone or something so that you can see a lot of details"],["commercial","an ad on radio or TV"],["common","something that you can see very often"],["complete","finish"],["costume designer","person who makes special clothes that actors wear"],["cover","put over"],["create","make"],["critic","a person who writes down what he thinks about a book or a film"],["decade","ten years"],["decide","make up your mind about something"],["depend on","to be affected by something else"],["develop","grow"],["direct","to be in control of a film"],["distance","space from one place to another"],["distribute","to send to places so that it can be shown"],["editor","person who prepares something so that it can be used"],["encounter","to meet someone for the first time"],["enjoy","to be happy about something and like it"],["enlarge","to make bigger"],["entertainment","things such a films, television, music performances etc.. that people watch or go to"],["equipment","the tools or objects you need to do a job"],["explore","to find out about something"],["fame","if you are known by many people because you are successful"],["female","about women or gils"],["finally","in the end"],["focus on","to see clearly"],["foreign","from another country"],["forward","further on"],["frame","a single photo of a film"],["gain","get"],["gang","group of young people who spend a lot of time together and do bad or violent things. They also fight against other groups"],["hire","to give someone a job"],["Holocaust","the killing of millions of Jews by the Nazis during World War II"],["image","picture"],["in charge","to have control over something"],["instruction","information on how to do something"],["inventor","a person who makes something that has not existed before"],["involve","to take part in something"],["layer","a material that is between two other things"],["lens","a curved piece of glass that makes things look bigger or clearer when you look through it"],["light bulb","the glass part of a lamp that gives off light when it is turned on"],["lighting","the lights that light up a room or a building"],["light-sensitive","something that reacts easily if there is light"],["major","big"],["mixture","two things that make one"],["mood","how you feel about something"],["motion picture viewer","a machine that shows a film"],["on location","place outside the film studio where scenes are shot"],["operate","work"],["order","the way things are arranged; it shows if something is first, second, third etc.."],["originally","at first"],["overall","generally, on the whole"],["paralyzed","if you cannot feel or move parts of your body"],["peephole","a small hole or opening which you can look through"],["piece","part"],["popular","well known"],["praise","to say good things about something or someone"],["produce","make"],["production team","people responsible for making the film"],["profit","money"],["project","to show a picture on a screen"],["promote","to make something popular or to get people to buy something"],["raise","to collect from people"],["real","not false"],["real event","something that has really happened"],["realistic","very real"],["receive","get"],["record","to make a copy of something on tape, CD or DVD"],["regard","to think about something in a special way"],["register","see"],["right","correct"],["run","to show"],["sales","the selling of something"],["scenery","the background of a film that is made by people"],["screen","large area on which films are shown"],["secret serviceman","a man that works for the government and protects it and especially the president"],["sequel","a book or film that continues the story of an earlier one"],["serious","not silly, not humorous"],["set","place where part of the movie is filmed"],["shoot - shot","make, film"],["shot","scene that is filmed without stopping the camera"],["shutter","part of a camera that opens to let light through the lens"],["single","only one"],["size","how big something is"],["skyscraper","very tall building in a city"],["spectacular","very impressive"],["spot","place"],["statuette","small statue"],["still","not moving"],["success","when you have done or finished something that you really wanted to do"],["successful","to become popular and to make a lot of money"],["take place","happen"],["total view","the whole scene, everything that is in the film"],["transfer","to put into another place"],["trilogy","a group of three books or movies that have the same characters"],["viewer","person who watches a film in the cinema"],["violence","behavior that makes you hurt or kill someone"],["war veteran","a person who has been a soldier in a war"],["whether","if"],["whole","all of"],["wide","from one side of something to the other"],["works","films"]],"qs":[{"t":"tf","q":"“distribute” means: to send to places so that it can be shown","a":true},{"t":"tf","q":"“ad” means: large area on which films are shown","a":false},{"t":"tf","q":"“audience” means: the people who go to a cinema and watch a film","a":true},{"t":"tf","q":"“sales” means: to give someone a job","a":false},{"t":"tf","q":"“record” means: to make a copy of something on tape, CD or DVD","a":true},{"t":"mcq","q":"Which word means: “make up your mind about something”?","o":["inventor","successful","decide"],"a":2},{"t":"mcq","q":"Which word means: “large area on which films are shown”?","o":["battle","screen","peephole"],"a":1},{"t":"mcq","q":"Which word means: “in the end”?","o":["finally","encounter","distribute"],"a":0},{"t":"mcq","q":"Which word means: “to give someone a job”?","o":["mood","hire","overall"],"a":1},{"t":"mcq","q":"Which word means: “to put into another place”?","o":["transfer","breakthrough","bright"],"a":0},{"t":"gap","q":"Millions of people all over the world go to cinemas to ___ an entertaining story and to see their favorite movie stars.","a":"enjoy"},{"t":"gap","q":"He also has to make plans to show and ___ the finished film in cinemas around the world.","a":"distribute"},{"t":"gap","q":"The company hopes that it can bring as many ___ as possible into the cinemas.","a":"viewers"},{"t":"gap","q":"In the 1920s sound was added to movies, the first colour movies were ___ in the late 1930s and early 1940s.","a":"produced"},{"t":"gap","q":"There are many festivals and ___ for motion pictures.","a":"awards"}]},{"id":"a26","day":26,"title":"Theatre","text":"A theatre is a place where people go and see all kinds of performances. Most people think of a theatre as a place to see a play, where a story that is acted out in front of an audience. But there are other kinds of performances that take place in a theatre too: musicals, ballets and operas.\n\nThe theatre building Most theatres have three parts: the stage, the auditorium and the backstage area.\n\nThe stage is the most important part of a theater. It is the place where actors and actresses perform a play. Most plays are performed on a proscenium or picture-frame stage. The audience can watch the play only from the front. The action takes place under a large arch. A curtain opens and closes at the beginning and end of each scene.\n\nSometimes the audience can sit on three sides of a stage. Some theatres have a round stage in the middle of the auditorium with spectators sitting around it. Actors get on and leave the stage through the audience.\n\nThe auditorium is where the audience sits. Modern theatres also have lobbies, rest rooms, cafes and bars to offer people more comfort before and after the performance, as well as between scenes.\n\nThe backstage area is the place where the scenes are prepared and actors and actresses get dressed. There are also storage and office rooms for the staff and theatre workers. There are rooms in which technicians control lighting and sound.\n\nPeople in a theatre Many people work together in a theatre. Every production begins with a producer – sometimes a man or a woman, sometimes a whole group of people or a company.\n\nProducers have a lot of things to do. They have to collect money for the play, get a story and a usable script. They must be able to work with a good team.\n\nThe director decides how the play should be performed. He interprets the script, works together with the people who make the scenery and costumes. The director oversees rehearsals and tells actors how to play their part. In modern plays a playwright writes the script.\n\nDesigners create the scenery that shows the time and place of the story. Lighting experts have the job of moving actors or pieces of the stage into the spotlight. Lighting effects help to create the atmosphere of a play.\n\nA casting director takes over the job of selecting actors and actresses for the play. They must choose a person with a suitable voice and character for every role. Make-up artists and costume designers help make the actors look good. Choreographers plan dance steps and other movements.\n\nActors and actresses are the main people in the play. They must study a character’s appearance, speech, body movements and gestures. Practicing this is not always easy. In order to play a role well the actor must know a lot about emotions and the feelings that someone can have. They must concentrate on their role and keep out everything that may distract them.\n\nScene design Designers build the scenery on a stage. Sometimes they don’t have to change it during the play. At other times sets have to be changed quickly during performances. Modern theaters have stages that can revolve or stages that can be raised or lowered.","targets":[["act out","perform"],["appearance","looks"],["arch","a curved structure above an opening"],["audience","the people who sit in the front and watch the play"],["auditorium","the part of the theatre where the people sit and watch the play"],["backstage","behind the stage, where the actors and actresses get dressed"],["body movement","the way a person moves and the special things he does"],["casting director","a person who chooses the right performers for a play"],["choreographer","a person who shows the dancers the movements during a performance"],["collect","get money from anywhere you can"],["comfort","to be relaxed, fell good"],["company","a business organization"],["concentrate","focus on"],["create","make"],["curtain","piece of cloth that hangs from the ceiling"],["distract","to take away your attention"],["gesture","when you move your hands or head to show what you mean or feel"],["interpret","to show the play the way you understand it"],["lighting","the light in a room and how it shines on the stage and actors"],["lobby","a large hall near the entrance"],["lower","to move down"],["movement","to go from one place to another"],["offer","give"],["oversee","supervise, watch over"],["perform","act"],["performance","when people act out a play or play music on a stage"],["piece","object"],["playwright","someone who writes the script of the play"],["proscenium","part of a stage that is front of the curtain"],["raise","to move up"],["rehearsal","the time when all the people of a play practice before the performance"],["rest room","toilet"],["revolve","to go around in a circle"],["scenery","the background and all the objects on a stage"],["script","the written form of a play"],["set","the scenery or objects that are used on a stage"],["spectator","a person who watches an event"],["speech","the language a person uses"],["spotlight","a light which you can direct at someone on a stage"],["staff","all the people who work in a theatre"],["stage","the higher area of a theatre where the actors and actresses perform or singers sing"],["storage","place where you keep things that you do not need"],["suitable","right, correct"],["technicians","people who work on and control the technical parts"],["usable","something you can use"]],"qs":[{"t":"tf","q":"“collect” means: get money from anywhere you can","a":true},{"t":"tf","q":"“speech” means: a large hall near the entrance","a":false},{"t":"tf","q":"“choreographer” means: a person who shows the dancers the movements during a performance","a":true},{"t":"tf","q":"“stage” means: place where you keep things that you do not need","a":false},{"t":"tf","q":"“auditorium” means: the part of the theatre where the people sit and watch the play","a":true},{"t":"mcq","q":"Which word means: “to be relaxed, fell good”?","o":["comfort","usable","proscenium"],"a":0},{"t":"mcq"," spymasters.\n\nDuring the last year of the war Fleming travelled to Jamaica to a naval conference. He fell in love with the island and built himself a house, which he called Goldeneye. For six years he travelled back and forth from Britain to Jamaica, where he spent the winter, met lovely women, and enjoyed the sunset.\n\nHe quit the Foreign Office and turned to writing. He spent his time developing the Bond character and leading the life that he desired. In the late 1950s Fleming started to suffer from bad health, probably because he was a heavy drinker and smoker. He died in 1964. James Bond James Bond is probably one of the most famous and longest running characters in film history. Since his first appearance in Dr. No (1962) the Queen’s number one spy has travelled to more places, romanced more women, escaped from more dangerous situations and saved the world more times than any other secret agent in history.\n\nAfter the war he entered the British Secret Intelligence Service, known as MI6, where he became a “double-0” agent with a license to kill. His assignments have taken him to volcanic islands, India, Las Vegas and even a space station in orbit. He has charm, loves beautiful women, and likes martinis - shaken, not stirred-, fine suits and fast cars. Most of Bond’s missions bring him into contact with shadowy figures of the underworld.\n\nSome of James Bond’s enemies •   Dr. Julius No - an atomic scientist who lost both of his hands. •   Auric Goldfinger – a smuggler who wants to obtain all the gold in the world. •   Oddjob – Goldfinger’s henchman •   Jaws – a strong man with steel teeth •  Elliot Carver – a media mogul who wants to control the world MI6 servants •   M is the head of MI 6. In the first films M was a man but in the last ones Bond’s boss is a woman (played by Judy Dench). M finds Bond’s habits frustrating but respects his many talents and sends him on missions where all other agents have failed. •   Q is the head of the service’s research centre.\n\nHe develops the gadgets and weapons that often save Bond’s life. •   Moneypenny is M’s personal secretary, known for her flirting encounters with Bond. History of Bond films Starting in 1962, Fleming’s novels have been made into successful films. All 22 of them have made a net profit of over $4 billion. Sean Connery was the first, and for many true followers of the series the best, Bond. He played the role in six movies from 1962 to 1971. George Lazenby took over the role for one film “On Her Majesty’s Secret Service” , but gave it back to Connery for one more film.\n\nFrom 1973 to 1985 Roger Moore portrayed Bond in more like a playboy way, with more humor and less determination than Connery. Timothy Dalton played James Bond in two movies and Pierce Brosnan starred in four movies from 1995 to 2002. Daniel Craig is the present Bond, starring in Casino Royal in 2006 and A Quantum of Solace in 2008.\n\nBond films always have the same ingredients: a lot of action, car chases, leaps from high mountains, gunfights and narrow escapes.\n\nThe selection of a Bond girl is almost as important as the choice of the main character himself. She is not only beautiful but also a woman that causes Bond great trouble when he finds himself attracted to her. Some of them are real villains while others have their own tragic background. Bond usually wins the girl but sometimes she betrays him and dies. James Bond always drives in extravagant cars that have included an Aston Martin, a BMW Z3 and a Lotus Esprit. He also is the first to test MI5s latest inventions- deadly darts, watches that explode and special guns.\n\nThe Bond films Movie                            Year    Main actor Dr. No                           1962    Sean Connery From Russia with Love Goldfinger Thunderball You Only Live Twice On Her Majesty’s Secret          1969    George Lazenby service Diamonds are forever             1971    Sean Connery Live and Let Die             1973    Roger Moore The Man with the Golden Gun The Spy who loved me Moonraker For your Eyes Only Octopussy A View to Kill The Living daylights         1987    Timothy Dalton License to Kill Golden Eye                   1995    Pierce Brosnan Tomorrow Never Dies The World is not Enough Die Another Day Casino Royale                2006    Daniel Craig Quantum of Solace","targets":[["appearance","to show for the first time"],["assignment","job, mission"],["assistant","helper"],["betray","to be disloyal to someone who trusts you"],["billion","one thousand million"],["charm","something that you have that makes other people like you"],["chase","to go after someone or follow someone"],["dart","a pointed object that you throw or shoot as a weapon"],["desire","like"],["determination","to try to do something even when it is difficult"],["develop","design, make, plan"],["encounter","to meet, come across someone"],["extravagant","something that is expensive and costs a lot of money"],["followers","a real fan"],["Foreign Office","the British government department that is responsible for dealing with other countries"],["gadget","a small, cleverly made machine"],["habit","the things you normally do"],["henchman","the helper of someone who also does criminal or illegal things for him"],["ingredient","the qualities you need to do something"],["invention","a machine or a tool that someone makes for the first time"],["license","if you are officially allowed to do something"],["mission","job"],["mogul","a businessman or –woman who has great power in a special industry"],["naval","having to do with the navy"],["net profit","the money that you get from something after all the expenses are paid"],["news agency","an organization that collects news and gives it to radio, TV or newspapers"],["novel","a long written story with fictional characters"],["novelist","a person who writes a novel"],["orbit","to go around something"],["please","like"],["portray","to be shown as"],["quit","stop working as"],["research","to study something and find out new things about it or develop something new"],["romance","to try to make someone love you"],["secret","something that only few people know about"],["Secret Intelligence Service","British organization whose job it is to keep Britain safe from attack by enemies in the country"],["shadowy","unclear, mysterious"],["smuggler","someone who brings things illegally from one country to another"],["space station","a large spaceship that stays in orbit around the earth"],["spy","someone who has the job of finding out secret information about another country"],["spymaster","big and important spy"],["stir","to move water or another drink in a glass around with a spoon"],["suit","a set of clothes consisting of a jacket and trousers, normally made of the same material and in the same colour"],["villain","the main bad character in a film"]],"qs":[{"t":"tf","q":"“extravagant” means: something that is expensive and costs a lot of money","a":true},{"t":"tf","q":"“novel” means: to try to make someone love you","a":false},{"t":"tf","q":"“invention” means: a machine or a tool that someone makes for the first time","a":true},{"t":"tf","q":"“smuggler” means: to be shown as","a":false},{"t":"tf","q":"“charm” means: something that you have that makes other people like you","a":true},{"t":"mcq","q":"Which word means: “the qualities you need to do something”?","o":["henchman","ingredient","betray"],"a":1},{"t":"mcq","q":"Which word means: “to try to make someone love you”?","o":["billion","romance","followers"],"a":1},{"t":"mcq","q":"Which word means: “something that only few people know about”?","o":["smuggler","stir","secret"],"a":2},{"t":"mcq","q":"Which word means: “to be shown as”?","o":["research","gadget","portray"],"a":2},{"t":"mcq","q":"Which word means: “job, mission”?","o":["appearance","assignment","followers"],"a":1},{"t":"gap","q":"Fleming introduced Bond in his first ___ Casino Royale in 1953.","a":"novel"},{"t":"gap","q":"During the last year of the war Fleming travelled to Jamaica to a ___ conference.","a":"naval"},{"t":"gap","q":"History of Bond films Starting in 1962, Fleming’s ___ have been made into successful films.","a":"novels"},{"t":"gap","q":"Sean Connery was the first, and for many true ___ of the series the best, Bond.","a":"followers"},{"t":"gap","q":"George Lazenby took over the role for one film “On Her Majesty’s ___ Service” , but gave it back to Connery for one more film.","a":"secret"}]},{"id":"a28","day":28,"title":"Beyonce Knowles","text":"Beyoncé Knowles is one of the really multitalented entertainment stars of the present. She is an American singer, songwriter, record producer, actress, dancer and fashion designer. Knowles became famous as the lead singer of the Rhythm and Blues group Destiny’s Child, probably the most successful female groups of all times.\n\nAt the age of 7 she attended dance school and later on became a solo singer in her church’s choir. Together with a few of her friends she started a quartet and at first performed in their back yards. In 1996 the group signed up with Columbia records and became very successful in the early 2000s.\n\nAfter successful CDs with Destiny’s Child Beyoncé released her first solo Album Dangerously in Love in 2003. With its singles Crazy in Love and Baby Boy it rose to the top of the charts in the UK and America. In 2004 Knowles earned five Grammy Awards .\n\nIn 2001 Knowles turned to acting. Her most famous role came in 2006 in an adaptation of a Broadway musical. Dreamgirls is based on the success of the Supremes, a black female group of the 1970s. Knowles was nominated for two Golden Globes including Best Actress.\n\nBeyoncé Knowles also has worked a lot for the poor and hungry people in our world. She helped form Survivor Foundation, an organization that provides housing for the victims of Hurricane Katrina. She also went to Ethiopia and promised to help poor people there. On the other hand, animal rights organizations have criticized her for wearing fur.","targets":[["actress","a woman who acts on stage or in a film"],["adaptation","new and changed version"],["animal rights organization","organization that tries to help animals survive in our world"],["attend","go to"],["based","to be the origin of"],["chart","the most successful songs in a country"],["choir","a group of people who sing together"],["earn","get"],["entertainment","things such as music, TV, radio, shows and other performances that people watch"],["fashion designer","person who designs modern clothes"],["female","relating to a woman"],["fur","the hairy skin of animals"],["Golden Globe","awards like the Oscars"],["Grammy Award","prizes that are given to singers and groups by the American music industry"],["housing","places to live"],["lead singer","most important singer in a group"],["nominate","to suggest someone for a prize or award"],["perform","act"],["present","today"],["promise","to say that you will do something in the future"],["provide","give"],["release","to bring out"],["sign up","to put your name on a document because you want to take part in something"],["success","when you become famous or you have done what you wanted to"],["successful","to be very famous and earn much money"],["survivor","a person who has escaped death and can live on"],["victim","someone who suffers because something bad has happened to them"]],"qs":[{"t":"tf","q":"“based” means: to be the origin of","a":true},{"t":"tf","q":"“success” means: relating to a woman","a":false},{"t":"tf","q":"“promise” means: to say that you will do something in the future","a":true},{"t":"tf","q":"“choir” means: to be very famous and earn much money","a":false},{"t":"tf","q":"“victim” means: someone who suffers because something bad has happened to them","a":true},{"t":"mcq","q":"Which word means: “new and changed version”?","o":["successful","adaptation","entertainment"],"a":1},{"t":"mcq","q":"Which word means: “relating to a woman”?","o":["promise","female","housing"],"a":1},{"t":"mcq","q":"Which word means: “the most successful songs in a country”?","o":["chart","victim","survivor"],"a":0},{"t":"mcq","q":"Which word means: “to be very famous and earn much money”?","o":["survivor","successful","success"],"a":1},{"t":"mcq","q":"Which word means: “the hairy skin of animals”?","o":["nominate","housing","fur"],"a":2},{"t":"gap","q":"Together with a few of her friends she started a quartet and at first ___ in their back yards.","a":"performed"},{"t":"gap","q":"Her most famous role came in 2006 in an ___ of a Broadway musical.","a":"adaptation"},{"t":"gap","q":"Beyoncé Knowles is one of the really multitalented ___ stars of the present.","a":"entertainment"},{"t":"gap","q":"At the age of 7 she ___ dance school and later on became a solo singer in her church’s choir.","a":"attended"},{"t":"gap","q":"In 2004 Knowles ___ five Grammy Awards .","a":"earned"}]},{"id":"a29","day":29,"title":"The Twilight Saga","text":"Twilight is a series of fantasy novels written by the American author Stephanie Meyer. The books have become well-known throughout the world and even led to the production of movies. They have been on the world’s bestseller lists for many years.\n\nPlot Bella Swan, a beautiful young teenager moves from Phoenix, Arizona to Forks, Washington. There she falls in love with Edward Cullen, a handsome boy. As time goes on she finds out that Edward is a member of a vampire family that drinks blood. James, a vampire from another family tries to kill her but Edward comes to her rescue.\n\nIn The New Moon Bella becomes a friend with the werewolf Jacob, who protects her from Victoria, James’ friend and another vampire that wants to kill Bella. When Edward believes that Bella is dead he wants to commit suicide in Italy but Bella manages to stop him. In the hands of a powerful vampire family, they are set free only if Bella agrees to become a vampire.\n\nEclipse is the third part of the Twilight saga. Victoria puts together an army of vampires to fight against the Cullen family and kill Bella. Bella has to decide between Edward and her friendship with James the werewolf. In the end Bella chooses Edward and agrees to marry him.\n\nIn the fourth part Bella is pregnant. She nearly dies while giving birth to her daughter, who is half vampire and half human. Edward injects vampire venom into her which turns her into a vampire and rescues her. A quarrel breaks out between the Cullen and Volturi family who think that the Bella’s daughter is an immortal child. They can be convinced that Bella’s daughter is not a threat to the family.\n\nThere are a few main topics in Stephanie Meyers’ book. Although the reader feels that a real love between Bell and Edward is not possible the couple is more and more drawn towards each other. It centers on love, not death. The book is also about escape. When Bella learns that she can become immortal too she really wants to get away from her mortal world.","targets":[["agree","to say yes"],["although","while"],["commit suicide","to kill yourself"],["convince","to make a person feel that something is true"],["couple","two people who are having a love relationship"],["drawn towards","to move to each other"],["handsome","very nice and good-looking"],["human","half a person"],["immortal","to live on forever"],["manage","to somehow be able to do something"],["novel","a long story in which characters and events are not real"],["pregnant","to expect a baby"],["protect","guard, defend"],["quarrel","argument"],["rescue","save"],["saga","a long story with many parts"],["series","elements that belong to the same group"],["set free","to be free"],["threat","danger"],["throughout","in all of"],["topic","subjects, themes"],["venom","a liquid poison"],["werewolf","a person who changes into a wolf every month when the moon is full"]],"qs":[{"t":"tf","q":"“immortal” means: to live on forever","a":true},{"t":"tf","q":"“convince” means: a person who changes into a wolf every month when the moon is full","a":false},{"t":"tf","q":"“series” means: elements that belong to the same group","a":true},{"t":"tf","q":"“pregnant” means: to say yes","a":false},{"t":"tf","q":"“protect” means: guard, defend","a":true},{"t":"mcq","q":"Which word means: “a liquid poison”?","o":["series","venom","couple"],"a":1},{"t":"mcq","q":"Which word means: “a person who changes into a wolf every month when the moon is full”?","o":["series","pregnant","werewolf"],"a":2},{"t":"mcq","q":"Which word means: “to somehow be able to do something”?","o":["manage","agree","saga"],"a":0},{"t":"mcq","q":"Which word means: “to say yes”?","o":["venom","agree","topic"],"a":1},{"t":"mcq","q":"Which word means: “a long story with many parts”?","o":["saga","agree","venom"],"a":0},{"t":"gap","q":"The books have become well-known ___ the world and even led to the production of movies.","a":"throughout"},{"t":"gap","q":"There she falls in love with Edward Cullen, a ___ boy.","a":"handsome"},{"t":"gap","q":"James, a vampire from another family tries to kill her but Edward comes to her ___.","a":"rescue"},{"t":"gap","q":"Eclipse is the third part of the Twilight ___.","a":"saga"},{"t":"gap","q":"Bella has to decide between Edward and her friendship with James the ___.","a":"werewolf"}]},{"id":"a30","day":30,"title":"Ferris Wheels – up into the Sky","text":"A Ferris wheel is a big structure made of steel that stands straight into the sky. Passenger cabins are connected to a moving wheel. The Ferris wheel is also called observation wheel because it takes passengers high up into the sky where they have a great view of the world around them.\n\nThe first such observation wheel was built by George Ferris, an American bridge builder. He designed and constructed a big wheel for the Chicago Exposition in1893. His name was used for all the big wheels that were built later.\n\nFerris’ first wheel was able to carry more than 2000 passengers. It was over 80 meters high and powered by two steam engines. The 37 cabins were able to carry 60 passengers each. Today, Ferris wheels are big attractions in major cities around the world. Smaller wheels can be found at local fairs, carnivals or theme parks. The world’s biggest Ferris wheel is currently the Singapore Flyer. The wheel reaches 165 meters into the sky and started rotating in 2008. An even bigger Ferris wheel is being built in Beijing, China. It is planned to reach a height of 208 meters and will start operation some time in 2009. The biggest observation wheel of the western world is the London Eye. It opened on December 31, 1999 – the last day of the millennium. The wheel takes visitors 135 meters up and gives them a fascinating view of the British capital.\n\nFerris wheels have played a role in many books and films. Vienna’s Riesenrad may be the star among popular Ferris wheels. The final scene of Graham Greene’s “Third Man” plays there.","targets":[["attraction","great sight"],["cabin","a small room"],["construct","build"],["design","plan"],["exposition","a large event where you buy and sell products"],["height","how high something is"],["local fair","an outdoor event, where there are machines to see, games to play and where people sell products"],["millennium","a thousand years"],["observation","when you watch something for a certain time"],["rotate","to revolve, go around"],["steam engine","a machine that produces power by burning coal to make hot water"],["steel","a very strong metal made out of iron"],["structure","object"],["theme park","a place where you can have fun and where the whole park has one topic"],["view","sight"]],"qs":[{"t":"tf","q":"“height” means: how high something is","a":true},{"t":"tf","q":"“cabin” means: a very strong metal made out of iron","a":false},{"t":"tf","q":"“millennium” means: a thousand years","a":true},{"t":"tf","q":"“exposition” means: great sight","a":false},{"t":"tf","q":"“steel” means: a very strong metal made out of iron","a":true},{"t":"mcq","q":"Which word means: “a large event where you buy and sell products”?","o":["cabin","exposition","observation"],"a":1},{"t":"mcq","q":"Which word means: “a very strong metal made out of iron”?","o":["rotate","steel","cabin"],"a":1},{"t":"mcq","q":"Which word means: “when you watch something for a certain time”?","o":["observation","cabin","steel"],"a":0},{"t":"mcq","q":"Which word means: “great sight”?","o":["height","cabin","attraction"],"a":2},{"t":"mcq","q":"Which word means: “to revolve, go around”?","o":["rotate","height","observation"],"a":0},{"t":"gap","q":"Passenger ___ are connected to a moving wheel.","a":"cabins"},{"t":"gap","q":"The first such ___ wheel was built by George Ferris, an American bridge builder.","a":"observation"},{"t":"gap","q":"The 37 ___ were able to carry 60 passengers each.","a":"cabins"},{"t":"gap","q":"Today, Ferris wheels are big ___ in major cities around the world.","a":"attractions"},{"t":"gap","q":"The wheel reaches 165 meters into the sky and started ___ in 2008.","a":"rotating"}]}];

const SUF="(?:e|es|ed|d|ing|s|ies|ied|y|ly|er|ers|ion|ions|ation|ations|ment|ments|al|ally|ive|ively)?";
const STOP=new Set(["to","a","the","of","in","on","up","out","with","for","by","at","as","from","into","off","over","one","it","be"]);
function altsOf(w){const a=w.replace(/\(.*?\)/g,"").split(/\s*[–—,\/]\s*|\s+-\s*|\s*-\s+/).map(x=>x.trim().replace(/^(to|the|a)\s+/i,"")).filter(Boolean);
 return a.flatMap(x=>{const m=x.match(/^([a-z]+)-([a-z]+)$/i);return m&&m[1].slice(0,2).toLowerCase()===m[2].slice(0,2).toLowerCase()?[m[1],m[2]]:[x]})}
function mkRx(t){
 const ws=t.toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z\s'’-]/g,"").split(/[\s-]+/).filter(Boolean);
 if(!ws.length)return null;
 const p=ws.map(w=>{if(w.length<=3||STOP.has(w))return w.replace(/z/g,"[sz]");const b=w.replace(/(e|y)$/,"").replace(/z/g,"[sz]");return b+SUF});

}

 for(const m of M){if(m.s>=last){out.push(m);last=m.e}}
 return out;
}

 $("#v").innerHTML=`${hd("Ma’noni toping")}<div class="pairs"><div>${shuffle(q).map(x=>`<button class="pr" data-s="l" data-w="${esc(x.w)}">${esc(x.w)}</button>`).join("")}</div><div>${shuffle(q).map(x=>`<button class="pr" data-s="r" data-w="${esc(x.w)}">${esc(x.m)}</button>`).join("")}</div></div>`;
 document.querySelectorAll(".pr").forEach(b=>b.onclick=()=>{
  const s=b.dataset.s;document.querySelectorAll(`.pr[data-s="${s}"]`).forEach(x=>x.classList.remove("sel"));b.classList.add("sel");
  if(s==="l")L=b;else R=b;
  if(L&&R){
   if(L.dataset.w===R.dataset.w){pass(q.find(z=>z.w===L.dataset.w),1);[L,R].forEach(x=>{x.classList.remove("sel");x.classList.add("gone");x.disabled=true});left--;L=R=null;if(!left)fin("Matching tugadi")}
   else{[L,R].forEach(x=>x.classList.add("shake"));L=R=null;setTimeout(()=>document.querySelectorAll(".pr").forEach(x=>x.classList.remove("sel","shake")),450)}}})}
function gMcq(q){let i=0;const pool=Object.values(S.box).map(x=>x.m);
 const nx=()=>{if(i>=q.length)return fin("Multiple choice tugadi");const x=q[i];
  const o=shuffle([x.m,...shuffle(pool.filter(m=>m!==x.m)).slice(0,3)]);
  $("#v").innerHTML=`${hd("Multiple choice",i,q.length)}<h2 class="big">${esc(x.w)}</h2>${o.map(m=>`<button class="opt">${esc(m)}</button>`).join("")}`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   document.querySelectorAll(".opt").forEach(z=>{z.disabled=true;if(z.textContent===x.m)z.classList.add("ok")});
   if(b.textContent===x.m)pass(x,2);else{b.classList.add("bad");q.push(x)}
   setTimeout(()=>{i++;nx()},900)})};nx()}
function gType(q){let i=0;
 const nx=()=>{if(i>=q.length)return fin("Typing tugadi");const x=q[i];
  $("#v").innerHTML=`${hd("So‘zni yozing",i,q.length)}<div class="card"><p class="mut">Ma’nosi:</p><h2>${esc(x.m)}</h2><input type="text" id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Inglizcha so‘zni yozing"><button class="btn" id="ck">Tekshirish</button><p id="fb"></p></div>`;
  guard($("#ti"));
  const chk=()=>{if($("#ck").disabled)return;$("#ck").disabled=true;const v=$("#ti").value.trim().toLowerCase(),ok=altsOf(x.w).some(z=>z.toLowerCase()===v)||v===x.w;
   $("#fb").innerHTML=ok?'<span class="okm">To‘g‘ri!</span>':`To‘g‘ri javob: <b>${esc(x.w)}</b>`;
   if(ok)pass(x,3);else q.push(x);setTimeout(()=>{i++;nx()},1100)};
  $("#ck").onclick=chk;$("#ti").onkeydown=e=>{if(e.key==="Enter")chk()}};nx()}
function gSent(q){let i=0;
 const nx=()=>{if(i>=q.length)return fin("So‘zlar faollashtirildi 🎉");const x=q[i];
  $("#v").innerHTML=`${hd("3 ta gap tuzing",i,q.length)}<div class="card"><h2>${esc(x.w)}</h2><p class="mut">${esc(x.m)}</p>${x.sen.map(s=>`<p>✅ ${esc(s)}</p>`).join("")}<p><b>${x.sen.length+1}-gap:</b></p><textarea id="st" rows="3" placeholder="Gapni o‘zingiz yozing (nusxa qo‘yib bo‘lmaydi)"></textarea><button class="btn" id="sb">Qo‘shish</button><p id="fb" class="err"></p></div>`;
  guard($("#st"));
  $("#sb").onclick=()=>{const t=$("#st").value.trim(),st=x.w.slice(0,Math.max(3,x.w.length-3)),f=m=>{$("#fb").textContent=m};
   if(t.split(/\s+/).length<5)return f("Gap kamida 5 ta so‘zdan iborat bo‘lsin.");
   if(!altsOf(x.w).some(z=>{const r=mkRx(z);return r&&r.test(t)}))return f(`Gapda “${x.w}” so‘zi ishlatilishi kerak.`);
   if(x.sen.includes(t))return f("Bu gap allaqachon yozilgan.");
   x.sen.push(t);save();if(x.sen.length>=3){pass(x,4);i++}nx()}};nx()}
function comp(a){
 $("#v").innerHTML=`${hd("Comprehension")}<div class="card"><h2>${esc(a.title)}</h2><p>Maqola nima haqida edi? O‘z so‘zlaringiz bilan yozing (kamida 20 so‘z).</p><textarea id="sm" rows="7"></textarea><p class="mut" id="wc">0 so‘z</p><p id="fb" class="err"></p><button class="btn" id="go">Davom etish</button></div>`;
 const t=$("#sm");guard(t);
 t.addEventListener("input",()=>$("#wc").textContent=(t.value.trim()?t.value.trim().split(/\s+/).length:0)+" so‘z");
 $("#go").onclick=()=>{const n=t.value.trim()?t.value.trim().split(/\s+/).length:0;
  if(n<20)return $("#fb").textContent="Kamida 20 ta so‘z yozing.";
  S.comp[a.id]={sum:t.value.trim()};P(a.id)[2]=1;save();
  $("#v").innerHTML=`<div class="card"><h2>Javobingiz saqlandi ✅</h2><button class="btn" data-hub="${a.id}">Keyingi bosqich</button></div>`}}
function quiz(a){let i=0,sc=0;const Q=a.qs;
 const nx=()=>{
  if(i>=Q.length){const ok=sc>=Math.ceil(Q.length*.6);if(ok){P(a.id)[1]=1;S.comp[a.id]=Object.assign(S.comp[a.id]||{},{score:sc})}save();
   return $("#v").innerHTML=`<div class="card"><h2>Natija: ${sc} / ${Q.length}</h2><p>${ok?"Bosqich bajarildi ✅":"Keyingi bosqich uchun kamida ${Math.ceil(Q.length*.6)} ta to‘g‘ri javob kerak. Qayta urinib ko‘ring."}</p><button class="btn" data-hub="${a.id}">Orqaga</button></div>`}
  const q=Q[i];let body="";
  if(q.t==="tf")body=["True","False"].map((o,j)=>`<button class="opt" data-a="${j}">${o}</button>`).join("");
  if(q.t==="mcq")body=q.o.map((o,j)=>`<button class="opt" data-a="${j}">${esc(o)}</button>`).join("");
  if(q.t==="gap")body=`<input type="text" id="gi" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="gb">Tekshirish</button>`;
  $("#v").innerHTML=`${hd("Savol "+(i+1)+" / "+Q.length,i,Q.length)}<div class="card"><p><b>${esc(q.q)}</b></p>${body}<p id="fb"></p></div>`;
  const done=ok=>{if(ok)sc++;$("#fb").innerHTML=ok?'<span class="okm">To‘g‘ri!</span>':`To‘g‘ri javob: <b>${esc(q.t==="tf"?(q.a?"True":"False"):q.t==="mcq"?q.o[q.a]:q.a)}</b>`;setTimeout(()=>{i++;nx()},1200)};
  if(q.t==="gap"){guard($("#gi"));$("#gb").onclick=()=>{$("#gb").disabled=true;done($("#gi").value.trim().toLowerCase()===q.a)}}
  else document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{document.querySelectorAll(".opt").forEach(z=>z.disabled=true);const j=+b.dataset.a,ok=q.t==="tf"?(j===0)===q.a:j===q.a;b.classList.add(ok?"ok":"bad");done(ok)})};nx()}
function authView(){let reg=true;$("nav").hidden=true;$("#hu").innerHTML="";$("#v").onclick=null;
 $("#v").innerHTML=`<div class="card"><h2 id="at">Ro‘yxatdan o‘tish</h2><input type="text" id="nm" placeholder="Ism va familiya" autocomplete="name"><input type="text" id="ph" inputmode="tel" placeholder="Telefon raqam (+998...)" autocomplete="tel"><input type="password" id="pw" placeholder="Parol (kamida 6 belgi)" autocomplete="current-password"><p id="er" class="err"></p><button class="btn" id="gb2">Ro‘yxatdan o‘tish</button> <button class="btn alt" id="sw">Kirish</button></div>`;
 $("#sw").onclick=()=>{reg=!reg;$("#at").textContent=reg?"Ro‘yxatdan o‘tish":"Kirish";$("#gb2").textContent=reg?"Ro‘yxatdan o‘tish":"Kirish";$("#sw").textContent=reg?"Kirish":"Ro‘yxatdan o‘tish";$("#nm").style.display=reg?"":"none"};
 $("#gb2").onclick=async()=>{const nm=$("#nm").value.trim(),d=$("#ph").value.replace(/\D/g,""),pw=$("#pw").value,er=$("#er");er.textContent="";
  if(d.length<9||pw.length<6||(reg&&!nm)){er.textContent="Ism, telefon raqam va parol (kamida 6 belgi) kerak.";return}
  const email=`p${d}@wordboost.app`;
  const r=reg?await sb.auth.signUp({email,password:pw,options:{data:{full_name:nm,phone:d}}}):await sb.auth.signInWithPassword({email,password:pw});
  if(r.error){const m=r.error.message;er.textContent=/already/i.test(m)?"Bu raqam ro‘yxatdan o‘tgan. Kirish tugmasini bosing.":/Invalid login/i.test(m)?"Raqam yoki parol noto‘g‘ri.":m;return}
  if(!r.data.session){er.textContent="Ro‘yxat yaratildi, lekin email tasdiqlash yoqilgan. Supabase’da Confirm email ni o‘chiring.";return}
  start(r.data.session.user)};
}
async function start(u){me=u;
 const [pr,rm,ar]=await Promise.all([sb.from("profiles").select("full_name,role").eq("id",u.id).single(),sb.from("wb_progress").select("data").eq("user_id",u.id).maybeSingle(),sb.from("wb_articles").select("id,day,data")]);
 prof=pr.data||{full_name:"",role:"student"};
 let loc={};try{loc=JSON.parse(localStorage.getItem("wb_"+u.id)||"{}")}catch(e){}
 S=Object.assign({arts:[],box:{},comp:{},p:{}},loc,rm.data?rm.data.data:{});
 REM=(ar.data||[]).map(r=>Object.assign({id:r.id,day:r.day},r.data));
 $("#hu").innerHTML=`<button class="btn alt sm" id="lo">Chiqish</button>`;
 $("#lo").onclick=async()=>{await sb.auth.signOut();location.reload()};
 const nv=$("nav");nv.hidden=false;
 if(prof.role==="teacher"&&!nv.querySelector('[data-go="prog"]'))nv.insertAdjacentHTML("beforeend",'<button data-go="prog"><span>📊</span>Progress</button>');
 go("art")}
async function push(){const B=Object.values(S.box);
 await sb.from("wb_progress").upsert({user_id:me.id,data:{box:S.box,p:S.p,comp:S.comp},words_added:B.length,words_active:B.filter(act).length,stages_done:ARTS().reduce((n,a)=>n+nDone(a.id),0),updated_at:new Date().toISOString()})}
async function prog(){tab="prog";$("#v").innerHTML='<p class="mut">Yuklanmoqda...</p>';
 const [a,b]=await Promise.all([sb.from("wb_progress").select("words_added,words_active,stages_done,updated_at,profiles(full_name,phone)"),sb.from("profiles").select("id",{count:"exact",head:true}).eq("role","student")]);
 const L=(a.data||[]).slice().sort((x,y)=>y.words_active-x.words_active||y.stages_done-x.stages_done),fd=d=>new Date(d).toLocaleDateString("en-CA"),td=fd(new Date());
 const tw=L.reduce((n,x)=>n+x.words_active,0),ta=L.filter(x=>fd(x.updated_at)===td).length,md=["🥇","🥈","🥉"];
 $("#v").innerHTML=`<h2>Progress</h2><div class="stats"><div class="stat"><b>${b.count||0}</b>o‘quvchi</div><div class="stat"><b>${ta}</b>bugun faol</div><div class="stat"><b>${tw}</b>faol so‘zlar</div></div>
 <h3>Reyting</h3>${L.map((x,i)=>`<div class="card item"><div><h3>${md[i]||i+1+"."} ${esc(x.profiles?.full_name||"Ism yo‘q")}</h3><p class="mut">${esc(x.profiles?.phone||"")} · oxirgi faollik: ${fd(x.updated_at)}</p></div><div style="text-align:right"><b>${x.words_active}</b> faol<br><span class="mut">${x.words_added} so‘z · ${x.stages_done} bosqich</span></div></div>`).join("")||'<p class="mut">Hali o‘quvchi faolligi yo‘q.</p>'}`}
sb.auth.getSession().then(async({data})=>{if(data.session){try{await start(data.session.user)}catch(e){authView()}}else authView()});
</script>
